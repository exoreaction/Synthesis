  ## Core Commands

  ```bash
  # Initialize workspace
  synthesis init

  # Scan/index files (200-300 files/sec)
  synthesis scan

  # Search everything (sub-second)
  synthesis search "keyword or phrase"

  # Show relationships (what breaks if you change this?)
  synthesis relate "filename"

  # Generate architecture graph (Mermaid format)
  synthesis graph --modules --format mermaid

  # Export documentation (for users' codebases)
  synthesis export --format onboarding-guide
  synthesis export --format architecture-doc

  # Watch mode (continuous indexing)
  synthesis watch

  # NEW: Enrich media files (Phase 2)
  synthesis enrich --level LOCAL "path/to/media/"

  # NEW: AI code explanations
  synthesis explain src/main/MyClass.java

  # NEW: Semantic search
  synthesis search "authentication logic" --semantic

  # NEW: Architecture monitoring
  synthesis architecture --check

  # NEW v1.4.1: Sub-workspace features
  synthesis search "<query>" --scope <sub-workspace>  # Scoped search
  synthesis search "<query>" --aggregate              # Grouped results
  synthesis migrate-repos [--dry-run]                 # Migrate to sub-workspaces
  synthesis staging list                              # Manage staging files
  synthesis staging promote <file> --to <workspace>   # Promote from staging
  ```

