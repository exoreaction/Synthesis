  ## Sub-Workspace Architecture (v1.4.1+, Feb 16, 2026)

  **Problem:** Flat workspace structure makes it hard to organize and search large codebases with multiple organizations, clients, and repos.

  **Solution:** Hierarchical sub-workspaces with scoped search and aggregation.

  ### Features
  1. **Organizational Hierarchy:** Nest organizations, clients, products as sub-workspaces
  2. **Repository Sub-Workspaces:** Treat individual repos as searchable units
  3. **Scoped Search:** `--scope` flag filters to specific sub-workspace
  4. **Aggregated Results:** `--aggregate` groups results by sub-workspace
  5. **Staging Workspaces:** Temporary areas (Downloads, Screenshots) with retention policies
  6. **Auto-Migration:** `migrate-repos` converts existing orgs/repos to sub-workspaces

  ### Architecture
  - **Data Model:** `SubWorkspaceConfig` with name, path, type, tags, inheritance
  - **Index Tagging:** Lucene documents tagged with `subWorkspace` field
  - **Configuration:** YAML-based with inheritance (parent → child)
  - **Database:** New `workspaces` table with `parent_id` for tree structure

  ### Example Structure
  ```
  Documents/
    ├── eXOReaction/ (sub-workspace, 2,932 files)
    │   ├── clients/
    │   │   ├── Elprint/
    │   │   └── Opplysningen-1881/
    │   ├── products/
    │   └── business/
    ├── Quadim/ (sub-workspace, 459 files)
    └── Cantara/ (sub-workspace, 857 files)
  ```

  ### Commands
  ```bash
  # See sub-workspace tree
  synthesis list

  # Scoped search
  synthesis search "authentication" --scope eXOReaction

  # Aggregated search
  synthesis search "README" --aggregate

  # Migrate existing orgs
  synthesis migrate-repos [--dry-run] [--orgs-only]

  # Staging management
  synthesis staging list
  synthesis staging promote "file.pdf" --to documents
  ```

