  ## Quick Reference: Next Post Decision Tree

  **Q1: What's the timing?**
  - Item Consulting workshop just happened (Feb 13) → Validation post (Track 2B, personal reflection)
  - SpareBank 1 presentation happened (Feb 4) → Follow-up with Engineering Manager perspective
  - New validation coming → Wait for fresh story, momentum matters
  - No recent news → Strategic positioning or technical deep-dive

  **Q2: What's the network priority?**
  - Enterprise deals hot (SpareBank 1) → Engineering Manager or Executive perspective
  - Open source growth needed → Developer perspective (Show HN prep)
  - Conference season → Workshop Facilitator perspective (CFP timing)
  - Consulting sector momentum (Item) → Sales Enablement perspective

  **Q3: What's the day of week?**
  - Monday → Strategic positioning (Executive, Security)
  - Tuesday → Educational (Engineering Manager, Workshop, DevOps)
  - Wednesday → Technical (Architect, Product Manager, Developer)
  - Thursday → Personal reflection (any perspective, peak engagement)
  - Friday → Rest (community engagement, no major posts)
  - Weekend → Avoid (except educational exceptions)

  **Q4: What's the campaign week?**
  - Follow 9-week calendar in SYNTHESIS-ATTENTION-STRATEGY.md
  - Each perspective gets one week spotlight
  - Don't repeat same perspective too frequently (burns network)
  - Rotate across different audiences for maximum reach

