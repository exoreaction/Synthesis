  ## Perspective-Specific Templates

  ### 1. Engineering Manager Perspective

  **Visual:** chaos-to-clarity-infographic.png + closing-ai-comprehension-gap.pdf
  **Track:** Educational (Track 1)
  **Day:** Tuesday
  **Network:** Enterprise decision-makers (SpareBank 1 pattern)

  **Template:**
  ```
  Hook: "Your developers generate code 10x faster with AI. Sprint velocity increased 1.5x. Where did the other 8.5x go?"

  Problem: The bottleneck shifted. Creation → Comprehension. AI accelerated coding but did nothing for search. Your team now generates 100-500 files/week/person but navigates with the same tools they used for 10-20.

  The math: 40-60% of developer time = searching for context. On a 10-person team, that's 4-6 FTE salaries spent on retrieval, not creation.

  Validation: [Recent case study - SpareBank 1, Item Consulting, or other]

  Solution: Engineering Manager perspective now available. 4-week adoption playbook. Success dashboard with 6 metrics. ROI: 4.1M NOK/year for 10-person team.

  Open source. Apache 2.0 license. 30-minute pilot (zero risk).

  Link: [Synthesis Engineering Manager Guide]

  Question: What percentage of your team's time is spent searching vs creating?

  #EngineeringManagement #AITools #DeveloperProductivity #SpareBank1
  ```

  ### 2. Executive Perspective

  **Visual:** executive-ai-paradox.png + strategic-ip-velocity-engine.pdf
  **Track:** Strategic Positioning (Track 2A)
  **Day:** Monday
  **Network:** Board members, investors (IASA Chairman network)

  **Template:**
  ```
  Title: "The AI Paradox: Why 10x Engineering Output = 1.5x Shipping Speed"

  Hook: You invested in AI tools. Developer output increased 10x. Time-to-market improved 1.5x. Where's the other 8.5x?

  Answer: Comprehension bottleneck. AI accelerated creation. Did nothing for search. Your team creates at AI speed, navigates at human speed.

  The math: 10-person team, 40% time searching = 4 FTEs (48M NOK/year) spent on retrieval.

  Strategic window: 12-18 months. Three classes emerging:
  - Class 1 (60%): Output-Overwhelmed (15-20% AI realization)
  - Class 2 (35%): Synthesis-Enabled (70-80% AI realization)
  - Class 3 (5%): Synthesis-Native (90-100% AI realization)

  Gap compounds. 2x shipping advantage today. Full product generation in 12 months.

  Executive brief: [Link to EXECUTIVE-BRIEF.md]

  Question: Which class is your organization?

  #DigitalTransformation #AIStrategy #ExecutiveLeadership #CompetitiveAdvantage
  ```

  ### 3. Product Manager Perspective

  **Visual:** product-manager-knowledge-center.png + product-knowledge-command-center.pdf
  **Track:** Educational (Track 1)
  **Day:** Wednesday
  **Network:** PM community, dev tool enthusiasts

  **Template:**
  ```
  Title: "Client Call in 2 Hours. Find the Demo Video."

  Scenario: Prospect asks for real-time analytics demo. 30 minutes panic-searching Google Drive, Slack, Downloads. Find wrong version. Miss 40% of impressive features.

  With Synthesis: `synthesis search "real-time analytics"` → 0.4 seconds
  Results: Demo video (4:32, 1920x1080), architecture docs, performance benchmarks, related code files.

  Demo prep: 3 minutes calm (vs 60-minute panic).

  Problem: 2-4 hours/week per PM spent searching for product knowledge. On a 5-person product team: 1 full FTE salary on retrieval.

  Solution: Product Manager perspective. Multi-format search. Demo workflows. QBR automation (2-3 hours → 10 minutes).

  Open source. Apache 2.0 license. Works with everything (code, docs, videos, PDFs, Figma exports).

  Link: [Synthesis for Product Managers]

  Question: How long did it take to find the materials for your last client demo?

  #ProductManagement #DemoPrep #OpenSource #KnowledgeManagement
  ```

