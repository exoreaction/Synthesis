  # Synthesis LinkedIn Campaign Executor

  **Purpose:** Create LinkedIn posts for Synthesis using the 9-perspective strategy
  **Context:** 405-605K NOK LinkedIn-attributed revenue validates approach (43% comment-to-lead conversion)
  **Strategy:** One perspective per week, each targets different audience/network, 9-week campaign

  ---

  ## Campaign Overview

  **9 Perspectives = 9 Different Audiences = 9x Surface Area**

  | Week | Perspective | Network | Day | Expected |
  |------|-------------|---------|-----|----------|
  | 1 | Engineering Manager | Enterprise (SpareBank 1) | Tue | 20-30 likes, 2-4 leads |
  | 2 | Executive | Board/Investor (IASA) | Mon | 25-40 likes, strategic convos |
  | 3 | Architect | Norwegian Tech (JavaZone) | Wed | 30-50 likes, IASA workshop |
  | 4 | DevOps | CI/CD Community | Tue | GitHub stars, platform teams |
  | 5 | Security | InfoSec/Compliance | Mon | 15-25 likes, Mynder collab |
  | 6 | Workshop Facilitator | Training Community | Tue | Conference invites |
  | 7 | Developer | Open Source (HN, Reddit) | Tue | 50-200 HN points, 100-500 stars |
  | 8 | Product Manager | PM Community | Wed | PM network, demo viral |
  | 9 | Sales Enablement | Consulting Sector | Thu | Sales pros, licensing interest |

  **Expected Campaign ROI:** 150-300K NOK pipeline (15-30 leads × 20% close × 50K avg)

  ---

  ## Post Creation Workflow

  When user requests a Synthesis LinkedIn post:

  ### Step 1: Identify Perspective
  Ask: "Which perspective? (or suggest next in 9-week calendar)"
  - Current week in campaign
  - Recent validations (Item Consulting, SpareBank 1)
  - Strategic timing (conferences, meetings, momentum)

  ### Step 2: Select Track & Format
  **Track 1: Educational (40%)** - Generate leads
  - Format: Hook → Invitation → Value → Specificity → CTA
  - Example: Workshop invitations, framework posts
  - Best days: Tuesday-Thursday
  - Expected: 20-30 likes, 5-15 comments, direct revenue

  **Track 2A: Strategic Positioning (20%)** - Long-term positioning
  - Format: Provocative question → Context → Implications → Open-ended conclusion
  - Example: "Are We Ready?", AI Paradox, Three Classes
  - Best days: Monday, Wednesday
  - Expected: 10-15 likes, 0-3 comments, strategic reach

  **Track 2B: Personal Reflection (20%)** - Relationship building
  - Format: Experience → Feeling → Meta-reflection → Implicit invitation
  - Example: Velocity reflection, building at 10x
  - Best days: Thursday (peak engagement)
  - Expected: 15-25 likes, 3-7 comments, 15-25% engagement rate

  **Track 3: Technical Foundation (20%)** - Technical credibility
  - Format: Specific problem → Technical depth → Practical patterns → Experiment frame
  - Example: Weekend projects, case studies, deep-dives
  - Best days: Wednesday
  - Expected: 7-14 likes, 0-1 comments, high impressions (niche)

  ### Step 3: Reference Assets
  **Visual Assets:** `/home/totto/src/synthesis/docs/visuals/`
  - Infographics: synthesis-overview, chaos-to-clarity, PM-knowledge-center, executive-ai-paradox, workshop
  - PDFs: 8 NotebookLM presentations (developer-infrastructure, managing-ai-output, etc.)
  - Usage guide: `docs/visuals/README.md`

  **Perspective Docs:** `/home/totto/src/synthesis/docs/perspectives/`
  - Link to relevant perspective guide in post
  - Extract key metrics, quotes, frameworks from docs

  **Validation Stories:**
  - Item Consulting: Finance-led adoption, 75% commitment, "Never seen them so focused"
  - SpareBank 1: Org-wide Claude Code rollout, Vidar presenting to team
  - Tvimenning: 190-230K partnership, renewable energy startup
  - lib-pcb: 8,934 files, 691/day generation rate, "needed Synthesis to manage it"

  ### Step 4: Apply Proven Patterns
  **Conservative Claims (10-30x proven):**
  - ✅ "10-30x typical, 100x+ possible" closed Jon Petter (190K)
  - ❌ "320x productivity" generated zero conversions
  - Use: "92-95% reduction in retrieval time" (measured)

  **Conditional Framing:**
  - ✅ "IF this scales..." not "WHEN this scales"
  - ✅ "Validated on 8,934 files" not "Will work for everyone"
  - Claim only what's proven, acknowledge unknowns

  **Help First, Never Pitch:**
  - ✅ SpareBank 1: "Asked for help with refactoring" → Inbound → 100-200K opportunity
  - ✅ Item Consulting: Educational presentation → Finance initiated purchase
  - ❌ Direct selling = resistance

  **Problem-First Framing:**
  - Open with concrete, quantified problem audience faces
  - Engineering Manager: "40-60% time searching = 4-6 FTE salaries wasted"
  - Architect: "58 repos, 429 dependencies - can you see them?"
  - Executive: "10x output, 1.5x shipping - where's the other 8.5x?"

  ### Step 5: Optimize for Engagement

  **Data-Driven Timing Insights (20+ posts analyzed, Feb 2026):**

  **Best Days (Proven):**
  - **Tuesday:** Educational content, enterprise audience (optimal for Track 1)
  - **Thursday:** Personal reflection peak (25.5% engagement rate on Feb 6 post)
  - **Wednesday:** Technical deep-dives (architect, developer perspectives)

  **Worst Days (Avoid):**
  - **Saturday:** Business audience inactive (Feb 15: 4 likes vs 15-25 expected)
  - **Sunday:** Abstract/philosophical content fails (Feb 8: 3 likes, 0 comments)
  - **Monday morning:** Lower visibility (catch-up mode)

  **Long-Tail Growth Pattern (CRITICAL INSIGHT):**
  Posts gain 20-100% more engagement over 2-4 weeks:
  - Jan 23 (AI Testing): 13 → 16 likes (+23% growth, 3 weeks)
  - Jan 27 (330x Productivity): 6 → 12 likes (+100% growth!, 2.5 weeks)
  - Feb 12 (Synthesis Pilot): 8 → 9 likes, 2 → 4 comments (3 days)

  **Implication:** Don't dismiss posts with low initial engagement. Quality content compounds.

  **Proven Performance Benchmarks:**

  **Track 1: Educational (Lead Generation):**
  - Expected: 20-30 likes, 5-15 comments
  - Best: Jan 25 Workshop (25 likes, 20 comments, 45 total engagement)
  - Conversion: 43% comment-to-lead (industry: 2-5%)
  - Revenue: 190-230K NOK from single post ⭐⭐⭐⭐

  **Track 2A: Strategic Positioning:**
  - Expected: 10-20 likes, 0-7 comments
  - Best: Feb 5 "Are We Ready?" (20 likes, 7 comments, growing!)
  - Conversion: Relationship building → delayed deals (Daniel Bentes: engaged Feb 5 → signed pilot Feb 12)

  **Track 2B: Personal Reflection:**
  - Expected: 15-25 likes, 3-7 comments
  - Best: Feb 6 Velocity (22 likes, 5 comments, 25.5% engagement rate)
  - Conversion: Item Consulting engaged 7 days before workshop

  **Track 3: Technical Credibility:**
  - Expected: 12-16 likes, 0-2 comments
  - Best: Jan 23 AI Testing (16 likes, 0 comments)
  - Conversion: Long-term credibility (no immediate revenue)

  **What Works (Proven):**
  - ✅ Conservative claims: "10-30x typical" converted deals, "320x" failed
  - ✅ Problem-first framing: "40-60% time searching" resonates immediately
  - ✅ Specific metrics: "92-95% reduction", "8,934 files in 31 seconds"
  - ✅ Visual assets: Infographics get 2-3x engagement
  - ✅ Early comment replies: Within 15 minutes (algorithm boost)
  - ✅ Finance-led adoption stories: Item Consulting CFO initiated purchase

  **What Fails (Proven):**
  - ❌ Saturday/Sunday posts: 50-70% lower engagement
  - ❌ Overclaiming: 320x productivity generated defensive reactions
  - ❌ Abstract without business hook: Feb 8 Ghost in Machine (3 likes)
  - ❌ Niche context: Feb 13 EntraOS (9 likes, 0 comments)

  **Hashtags (3-5 max):**
  - **Engineering Manager:** #EngineeringManagement #AITools #DeveloperProductivity #ClaudeCode
  - **Executive:** #DigitalTransformation #AIStrategy #ExecutiveLeadership #CompetitiveAdvantage
  - **Architect:** #SoftwareArchitecture #IASA #Microservices #DependencyManagement
  - **DevOps:** #DevOps #CICD #PlatformEngineering #InfrastructureAsCode
  - **Product Manager:** #ProductManagement #DemoPrep #OpenSource #KnowledgeManagement
  - **Security:** #CyberSecurity #Compliance #GDPR #AIGovernance #InfoSec
  - **Workshop:** #TechnicalTraining #WorkshopFacilitation #DeveloperEducation
  - **Developer:** #OpenSource #DeveloperTools #SoftwareEngineering #GitHub
  - **Sales:** #SalesEnablement #ConsultingLife #BusinessDevelopment

  **Post Length:**
  - Hook: 1 sentence (10-15 words)
  - Body: 3-5 short paragraphs (100-200 words total)
  - CTA: 1 sentence (specific ask)
  - Total: 150-250 words (scannable on mobile)

  **Media:**
  - Always attach relevant infographic or PDF first slide
  - Visual posts get 2-3x engagement vs text-only
  - High-res preferred (6+ MB infographics are print-quality)

  ### Step 6: Post-Publication Actions
  **Immediate (0-2 hours):**
  - Monitor for early comments
  - Respond within 15 minutes (engagement boost)
  - Engage with commenters (ask follow-up questions)

  **First 24 hours:**
  - Track engagement (track-linkedin-post skill)
  - Identify qualified leads (comment intent analysis)
  - DM high-intent commenters (within 24h while momentum fresh)

  **First week:**
  - Follow up with leads (schedule calls)
  - Document in opportunity README if qualified
  - Update PIPELINE-STATUS.md if hot lead

