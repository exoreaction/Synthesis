name: synthesis-mcp-decision-guide
version: 1.0.0
description: |
  Decision guide: which mcp__synthesis__* tool to call for each work task.
  Covers all 43 MCP tools with intent-to-tool mapping, key rules, and workspace routing.
  Use MCP tools instead of CLI for queries — faster, no shell permission prompt.

