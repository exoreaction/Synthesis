instructions: |
  # Synthesis Sub-Workspace Navigation

  **New in v1.4.1:** Hierarchical workspace organization with tree views and structural navigation.

  ---

  ## Core Navigation Commands

  ### 1. List All Workspaces with Tree View
  ```bash
  export PATH="$HOME/.synthesis/bin:$PATH"
  synthesis list 2>/dev/null
  ```

  **Shows:**
  - All discovered workspaces (scans configured search paths, not a global registry)
  - Sub-workspace tree structure with Unicode connectors
  - File counts per sub-workspace
  - Index sizes
  - Watch daemon status

  **Example output:**
  ```
  📁 Totto's Knowledge Base
  Path:        /home/totto/Documents
  Sub-spaces:  6
               ├── eXOReaction [general] (Last Updated: 2026-02-06)
               ├── Quadim [general] (Status: Active product company)
               ├── Cantara [general] (Type: Open Source Foundation)
               ├── Sunstone-Tech [general]
               ├── Synthesis [general]
               └── T-Hex [general]
  Files:       7,118
  ```

  ### 2. Check Specific Workspace Status
  ```bash
  export PATH="$HOME/.synthesis/bin:$PATH"
  synthesis -d /home/totto/Documents status 2>/dev/null
  ```

  **Shows:**
  - System overview (total workspaces, files, index size)
  - Current workspace details
  - Sub-workspace tagging breakdown
  - Watch daemon status
  - AI features status

  ### 3. Search to See Sub-Workspace Distribution
  ```bash
  export PATH="$HOME/.synthesis/bin:$PATH"
  synthesis search "<query>" --aggregate 2>/dev/null
  ```

  **Purpose:** See which sub-workspaces contain matches for your query.

  ### 4. List Files in Workspace with Sub-Workspace Tags
  ```bash
  export PATH="$HOME/.synthesis/bin:$PATH"
  synthesis -d /home/totto/Documents which "<pattern>" 2>/dev/null
  ```

  **Shows:** Files matching pattern with sub-workspace tags in verbose mode.

  ---

