  ---

  ## Sub-Workspace Types

  | Type | Purpose | Example | Features |
  |------|---------|---------|----------|
  | **general** | Default type | eXOReaction, Quadim | Standard indexing, search |
  | **repo** | Git repository | lib-pcb, Synthesis | Code-focused, branch tracking |
  | **organization** | Company/foundation | eXOReaction | Org-level metadata, client tracking |
  | **client** | Client project | Elprint, Opplysningen | Client-specific docs, status |
  | **staging** | Temporary area | Screenshots, Downloads | Retention policy, promotion |

  ---

  ## Exploring Sub-Workspace Content

  ### Pattern 1: Find where a topic lives
  ```bash
  # See distribution across sub-workspaces
  synthesis search "authentication" --aggregate 2>/dev/null

  # Then drill into specific area
  synthesis search "authentication" --scope eXOReaction 2>/dev/null
  ```

  ### Pattern 2: Explore client-specific content
  ```bash
  # List all workspaces to see structure
  synthesis list 2>/dev/null

  # Search within client area
  synthesis search "invoice" --scope eXOReaction --client Elprint 2>/dev/null
  ```

  ### Pattern 3: Navigate from broad to specific
  ```bash
  # 1. See all workspaces
  synthesis list 2>/dev/null

  # 2. Check specific workspace
  synthesis -d /home/totto/Documents status 2>/dev/null

  # 3. See sub-workspace breakdown
  synthesis search "README" --aggregate 2>/dev/null

  # 4. Dive into specific sub-workspace
  synthesis search "README" --scope Synthesis 2>/dev/null
  ```

  ---

  ## Sub-Workspace Metadata

  Each sub-workspace has:
  - **name** - Logical identifier (e.g., "eXOReaction")
  - **path** - Relative path from workspace root
  - **type** - general, repo, organization, client, staging
  - **description** - Human-readable description
  - **tags** - Keywords for classification (e.g., ["company", "has-clients"])

  View in config: `cat /home/totto/Documents/.synthesis/config.yaml`

  ---

  ## Common Navigation Tasks

  ### Task 1: "Where are the client files?"
  ```bash
  # See structure
  synthesis list 2>/dev/null

  # Search for client content
  synthesis search "client OR opportunity" --scope eXOReaction --limit 20 2>/dev/null
  ```

  ### Task 2: "What's in each organization?"
  ```bash
  # Aggregated view
  synthesis search "*" --aggregate 2>/dev/null

  # Or check status for breakdown
  synthesis status 2>/dev/null
  ```

  ### Task 3: "Find all PDFs by sub-workspace"
  ```bash
  synthesis search "extension:pdf" --aggregate --type PDF 2>/dev/null
  ```

  ### Task 4: "See staging area contents"
  ```bash
  # List staging files
  synthesis -d /home/totto/Downloads staging list 2>/dev/null

  # Or search staging sub-workspace
  synthesis -d /home/totto/Pictures search "*" --scope Screenshots 2>/dev/null
  ```

  ---

  ## File Distribution Analysis

  From last scan (Feb 16, 2026):

  **Documents workspace** (7,118 files total):
  - eXOReaction: 2,932 files (41%)
  - Cantara: 857 files (12%)
  - Quadim: 459 files (6%)
  - Synthesis: 120 files (2%)
  - Root (unorganized): 2,742 files (39%)
  - Other: 8 files (<1%)

  **Insight:** 39% of files are in root (not assigned to sub-workspace).
  Consider organizing or creating additional sub-workspaces.

  ---

  ## Creating New Sub-Workspaces

  ### Method 1: Auto-Migration
  ```bash
  # Migrate existing organizations
  synthesis migrate-repos --orgs-only --dry-run 2>/dev/null
  synthesis migrate-repos --orgs-only 2>/dev/null
  ```

  ### Method 2: Manual Configuration
  Edit `.synthesis/config.yaml`:
  ```yaml
  subWorkspaces:
    - name: "NewOrg"
      path: "NewOrg"
      type: "organization"
      description: "New organization sub-workspace"
      tags: ["company"]
  ```

  Then run a full scan to apply tags to all existing files (`maintain` only re-tags newly added/modified files):
  ```bash
  synthesis scan 2>/dev/null
  ```

  ---

  ## Pro Tips

  1. **Use tree view first:**
     Always run `synthesis list` when exploring unfamiliar workspace structure.

  2. **Combine with status:**
     `synthesis status` shows sub-workspace tagging breakdown after scanning.

  3. **Aggregate search for discovery:**
     Use `--aggregate` to see content distribution before drilling down.

  4. **Check root files:**
     Files not in any sub-workspace are tagged "(root)" - consider organizing them.

  5. **Use tags for filtering:**
     Sub-workspaces have tags (e.g., "has-clients") visible in tree view.

  ---

  ## Integration with Other Skills

  After navigating sub-workspaces:
  - **Search within:** Use `synthesis-scoped-search` skill
  - **Manage staging:** Use `synthesis-staging-management` skill
  - **View relationships:** Use `synthesis-relate-dependencies` skill
  - **Generate graph:** Use `synthesis-graph-architecture` skill
  - **Read files:** Use Read tool on discovered paths

  ---

  ## Error Handling

  - **Empty sub-workspace in tree** - Sub-workspace configured but no files match path
  - **No sub-workspaces shown** - Workspace not migrated yet, run `migrate-repos`
  - **"(root)" has most files** - Consider creating/migrating to sub-workspaces
  - **Tree view doesn't show** - Old Synthesis version, update to v1.4.1+
