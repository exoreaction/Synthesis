# SLF4J Simple Logger Configuration
# See: http://www.slf4j.org/api/org/slf4j/impl/SimpleLogger.html

# Default log level (OFF = no logging)
org.slf4j.simpleLogger.defaultLogLevel=ERROR

# Show date/time
org.slf4j.simpleLogger.showDateTime=false

# Show thread name
org.slf4j.simpleLogger.showThreadName=false

# Show logger name
org.slf4j.simpleLogger.showLogName=false

# Show short logger name
org.slf4j.simpleLogger.showShortLogName=false

# Log file (stdout/stderr or file path)
org.slf4j.simpleLogger.logFile=System.err

# Only show ERROR and above (suppresses INFO, DEBUG, TRACE, WARN)
org.slf4j.simpleLogger.log.io.exoreaction.synthesis=ERROR
