name: Test

# Runs the full test suite on every PR and on pushes to main. This repo had
# no general-purpose test gate before — kcp-conformance.yml and
# sign-manifests.yml only cover their own narrow paths — so a PR could merge
# with a real test failure and nothing would catch it.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run test suite
        run: mvn -B test
