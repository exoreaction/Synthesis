name: KCP export conformance

# Validates that `synthesis export --format kcp` produces a manifest the
# reference KCP consumer accepts (issue #354). The kcp-agent version is
# pinned — bump it deliberately so upstream spec drift is caught, not
# absorbed silently.

on:
  pull_request:
    paths:
      - 'src/main/java/io/exoreaction/synthesis/cli/ExportCommand.java'
      - 'src/main/java/io/exoreaction/synthesis/analyzer/YamlAnalyzer.java'
      - 'src/main/java/io/exoreaction/synthesis/kcp/**'
      - '.github/workflows/kcp-conformance.yml'
  workflow_dispatch:

env:
  KCP_AGENT_VERSION: '0.18.0'

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build synthesis jar
        run: mvn -B -q package -DskipTests

      - name: Create fixture workspace
        run: |
          mkdir -p /tmp/fixture/docs
          cat > /tmp/fixture/README.md <<'EOF'
          # Fixture Project

          A small fixture workspace used to validate KCP export conformance.

          ## Getting Started

          Read the docs.
          EOF
          cat > /tmp/fixture/docs/api.md <<'EOF'
          # API Reference

          ## Endpoints

          ## Authentication
          EOF
          cat > /tmp/fixture/SECURITY.md <<'EOF'
          # Security Policy

          Report vulnerabilities responsibly.
          EOF
          git -C /tmp/fixture init -q
          git -C /tmp/fixture add -A
          git -C /tmp/fixture -c user.email=ci@example.com -c user.name=ci commit -qm fixture

      - name: Generate KCP manifest
        run: |
          JAR=$(ls "$GITHUB_WORKSPACE"/target/synthesis-*.jar | grep -v sources | head -1)
          cd /tmp/fixture
          java -jar "$JAR" init --yes
          java -jar "$JAR" scan
          java -jar "$JAR" export --format kcp --output knowledge.yaml
          echo "--- generated manifest ---"
          cat knowledge.yaml

      - name: Validate with kcp-agent (pinned)
        # Since 0.18 the validator warns (not errors) on `kind: policy` —
        # it only knows `kind: skill` and loads other kinds as ungoverned
        # plain units. Expected output: "✓ valid — 1 warning(s)".
        run: npx --yes "kcp-agent@${KCP_AGENT_VERSION}" validate /tmp/fixture/knowledge.yaml

      - name: Plan over the generated manifest (pinned)
        run: |
          # The reference planner must produce a non-empty load plan for a
          # task the fixture's units cover ("endpoints" is an api.md trigger).
          npx --yes "kcp-agent@${KCP_AGENT_VERSION}" plan "what endpoints exist" \
            --manifest /tmp/fixture/knowledge.yaml
          npx --yes "kcp-agent@${KCP_AGENT_VERSION}" plan "what endpoints exist" \
            --manifest /tmp/fixture/knowledge.yaml --json > /tmp/plan.json
          # Non-empty plan: at least one selected unit
          node -e "const p=require('/tmp/plan.json'); const n=(p.units||p.plan||p.selected||[]).length; if(!JSON.stringify(p).includes('docs-api')){console.error('plan did not select docs-api');process.exit(1)} console.log('plan ok')"

      - name: Replay the saved plan (drift re-verification)
        run: |
          # Upstream bug (kcp-agent >= 0.14.0): `plan --json` wraps the artifact
          # in a versioned envelope (schemaVersion + kind), but replay's
          # comparable() does not strip those fields before diffing against the
          # freshly recomputed (unwrapped) plan — so every plan→replay
          # round-trip reports false drift "plan differs in: kind, schemaVersion".
          # Strip the envelope before replay; the determinism check itself
          # (selected/skipped/scores/manifest sha256) still runs at full strength.
          # Remove this workaround once fixed upstream.
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/plan.json','utf8'));delete p.schemaVersion;delete p.kind;fs.writeFileSync('/tmp/plan.json',JSON.stringify(p,null,2))"
          npx --yes "kcp-agent@${KCP_AGENT_VERSION}" replay /tmp/plan.json

      - name: Sign the manifest and have kcp-agent verify it (interop)
        run: |
          JAR=$(ls "$GITHUB_WORKSPACE"/target/synthesis-*.jar | grep -v sources | head -1)
          # Synthesis signs (Ed25519, in-manifest signing block + Cantara envelope .sig)
          java -jar "$JAR" kcp sign /tmp/fixture/knowledge.yaml
          # The reference consumer must verify the Synthesis signature (fail-closed).
          npx --yes "kcp-agent@${KCP_AGENT_VERSION}" plan "what endpoints exist" \
            --manifest /tmp/fixture/knowledge.yaml --require-signature
          # And it must REJECT a tampered manifest.
          sed -i 's/project: fixture/project: EVIL/' /tmp/fixture/knowledge.yaml
          if npx --yes "kcp-agent@${KCP_AGENT_VERSION}" plan "endpoints" \
               --manifest /tmp/fixture/knowledge.yaml --require-signature; then
            echo "FAIL: kcp-agent accepted a tampered manifest"; exit 1
          else
            echo "ok: tampered manifest rejected by kcp-agent"
          fi
