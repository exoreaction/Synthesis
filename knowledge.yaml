id: synthesis
name: "Synthesis"
version: "1.25.1-SNAPSHOT"
description: "AI operations partner for knowledge infrastructure that indexes
  codebases at 200-300 files/second, provides sub-second search, bi-directional
  dependency graphs, MCP/LSP integration, and AI-powered codebase Q&A — solving
  the AI-tools context gap where creation is 10x faster but comprehension stays
  at 1x."
