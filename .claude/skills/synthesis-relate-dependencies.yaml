name: synthesis-relate-dependencies
version: 1.1.0
description: |
  Show bidirectional relationships, imports, and dependencies for any file in a Synthesis workspace.
  Answers "what depends on this?" and "what does this depend on?" with optional Mermaid diagrams.
  For source code workspaces with a persisted code graph, relate uses instant SQLite lookups.
  Use --refresh to force re-extraction. Use --format json for machine-readable output.

