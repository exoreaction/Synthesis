instructions: |
  # Synthesis Staging Management

  Manage temporary/incoming files with time-based retention, auto-classification, and content-intelligent routing.

  ---

  ## What is a Staging Workspace?

  Staging workspaces are temporary holding areas for incoming files:
  - **Downloads** - 30-day retention, auto-classification enabled
  - **Pictures/Screenshots** - 90-day retention for screenshots

  **Purpose:**
  - Prevent clutter in permanent workspaces
  - Auto-classify and route files to proper locations
  - Track file age and suggest cleanup
  - Promote valuable files to permanent storage

  ---

  ## Core Commands

  ### 1. List Staged Files
  ```bash
  export PATH="$HOME/.synthesis/bin:$PATH"
  synthesis -d /home/totto/Downloads staging list 2>/dev/null
  ```

  **Shows:**
  - File paths with status badges
  - File sizes
  - Classification info (if auto-classify enabled)
  - Days until expiration
  - Organization/destination suggestions

  ### 2. Show Staging Stats
  ```bash
  export PATH="$HOME/.synthesis/bin:$PATH"
  synthesis -d /home/totto/Downloads staging stats 2>/dev/null
  ```

  **Displays:**
  - Total staged files
  - Retention configuration (e.g., 30 days)
  - Auto-classification settings
  - Expired file count
  - Storage usage

  ### 3. Find Expired Files
  ```bash
  export PATH="$HOME/.synthesis/bin:$PATH"
  synthesis -d /home/totto/Downloads staging expire --dry-run 2>/dev/null
  ```

  **Preview mode:** Shows what would be expired without making changes.

  ### 4. Process Expired Files
  ```bash
  export PATH="$HOME/.synthesis/bin:$PATH"
  synthesis -d /home/totto/Downloads staging expire 2>/dev/null
  ```

  **Warning:** This removes expired files from the index (files remain on disk).

  ### 5. Promote File to Permanent Workspace
  ```bash
  export PATH="$HOME/.synthesis/bin:$PATH"
  synthesis -d /home/totto/Downloads staging promote "path/to/file.pdf" --to documents 2>/dev/null
  ```

  **Optional:** Specify destination with `--dest "eXOReaction/clients/Elprint/"`

  ### 6. Ingest New Files
  ```bash
  export PATH="$HOME/.synthesis/bin:$PATH"
  synthesis -d /home/totto/Downloads staging ingest 2>/dev/null
  ```

  **Purpose:** Register newly downloaded files in the staging database.

  ### 7. Route Files to Permanent Destinations
  ```bash
  # Dry-run — see what would happen
  synthesis -d /home/totto/Downloads staging route --dry-run --verbose 2>/dev/null

  # Route for real
  synthesis -d /home/totto/Downloads staging route 2>/dev/null
  ```

  **How routing works (two-pass):**

  **Pass 1 — filename pattern rules** (defined in `routing.rules` in config.yaml):
  - Glob patterns matched against the file's basename
  - First matching rule wins; file is copied to `destination` directory
  - Source is renamed to `*_processed.*` (not deleted)
  - `→` prefix in output

  **Pass 2 — content intelligence fallback** (when `autoClassify: true`):
  - Files not matched by any rule go through `DownloadsClassifier.classifyWithCompanion()`
  - Reads filename keywords **and** the enriched `.synthesis.md` companion file (if present)
  - This unlocks classification of files like `Appendix H.pdf` whose filename has no org hint
  - Files above `classificationThreshold` (default 0.5) are auto-routed — `~` prefix in output
  - Files below the threshold get a suggestion but aren't moved — `?` in verbose mode
  - Files with no org match stay unmatched

  **Output example:**
  ```
  → Synthesis-Proposal-2026.pdf          # matched by rule
  ~ Appendix-H.pdf  (content: Merkabit)  # classified via companion content

  Routed: 2 (1 by rule, 1 by content)  |  Suggestions: 1  |  No match: 0
  ```

  **To get the best content-routing results, enrich first:**
  ```bash
  synthesis -d /home/totto/Downloads enrich --type pdf 2>/dev/null
  synthesis -d /home/totto/Downloads staging route 2>/dev/null
  ```

  ---

  ## Staging Workflows

  ### Workflow 1: Automated Routing (Recommended Daily Cron)
  ```bash
  # The full pipeline — run in order
  synthesis -d /home/totto/Downloads staging ingest 2>/dev/null   # register new files
  synthesis -d /home/totto/Downloads enrich --type pdf 2>/dev/null # extract PDF content
  synthesis -d /home/totto/Downloads staging route 2>/dev/null     # route by rule + content
  synthesis -d /home/totto/Downloads maintain 2>/dev/null          # housekeeping
  ```

  Or via the wrapper:
  ```bash
  synthesis maintain  # runs ingest + route + housekeeping
  ```

  ### Workflow 2: Daily Download Review
  ```bash
  # 1. Check what's new
  synthesis -d /home/totto/Downloads staging list 2>/dev/null

  # 2. Preview routing (dry-run with verbose suggestions)
  synthesis -d /home/totto/Downloads staging route --dry-run --verbose 2>/dev/null

  # 3. Route for real
  synthesis -d /home/totto/Downloads staging route 2>/dev/null

  # 4. Manually promote any remaining files
  synthesis -d /home/totto/Downloads staging promote "proposal.pdf" --to documents --dest "eXOReaction/clients/ItemConsulting/" 2>/dev/null
  ```

  ### Workflow 3: Weekly Cleanup
  ```bash
  # 1. Find expired files (dry-run)
  synthesis -d /home/totto/Downloads staging expire --dry-run 2>/dev/null

  # 2. Review the list, then process
  synthesis -d /home/totto/Downloads staging expire 2>/dev/null

  # 3. Refresh index
  synthesis -d /home/totto/Downloads scan 2>/dev/null
  ```

  ### Workflow 4: Screenshot Management
  ```bash
  # List screenshots by age
  synthesis -d /home/totto/Pictures staging list 2>/dev/null

  # Search for specific screenshots
  synthesis -d /home/totto/Pictures search "dashboard" --scope Screenshots 2>/dev/null

  # Promote important screenshot to Documents
  synthesis -d /home/totto/Pictures staging promote "Screenshots/2026/Screenshot_dashboard.png" --to documents --dest "eXOReaction/products/xorcery-aaa/screenshots/" 2>/dev/null
  ```

  ---

  ## Staging Configuration

  **Downloads workspace** (`/home/totto/Downloads/.synthesis/config.yaml`):
  ```yaml
  staging:
    enabled: true
    retentionDays: 30              # Auto-expire after 30 days
    autoClassify: true             # Enable content-intelligence routing fallback
    classificationThreshold: 0.5   # Min confidence to auto-route (0.0-1.0)
    cleanupExpired: false          # Manual cleanup

  routing:
    copyCompanions: true           # Move .synthesis.md alongside routed files
    rules:
      - name: "Synthesis docs"
        patterns: ["Synthesis_*.pdf", "synthesis-*.md"]
        destination: "/home/totto/Documents/eXOReaction/products/synthesis/"
      - name: "Invoices"
        patterns: ["*invoice*.pdf", "*faktura*.pdf"]
        destination: "/home/totto/Documents/eXOReaction/finance/invoices/"
  ```

  **Pictures/Screenshots** (`/home/totto/Pictures/.synthesis/config.yaml`):
  ```yaml
  subWorkspaces:
    - name: "Screenshots"
      path: "Screenshots"
      type: "staging"              # Marks as staging sub-workspace
      tags: ["screenshots", "temporary"]
  ```

  ---

  ## Auto-Classification & Content Routing

  **Downloads workspace** has auto-classification enabled via `DownloadsClassifier`:

  **What it does:**
  - Analyses filename keywords against the organization registry
  - Reads text content (markdown, txt, etc.) for additional signals
  - **Reads `.synthesis.md` companion files** — this is the key for PDFs and images whose
    filenames give no hint (e.g., `Appendix H.pdf`, `Screenshot_1234.png`)
  - Maps files to organizations via keyword index
  - Suggests destination paths based on org + file type
  - Flags software installers for skipping (.deb, .exe, .dmg)

  **Signals used (in order):**
  1. Filename keywords (weight: 0.5 per match)
  2. File content — text-readable files only (weight: 0.3 per org)
  3. Companion `.synthesis.md` content — always text-readable (weight: 0.3 per org)

  **Example — filename has a hint:**
  - File: `elprint-invoice-2026-02.pdf`
  - Classified as: eXOReaction → `eXOReaction/clients/Elprint/business/`

  **Example — filename has NO hint (issue #71 scenario):**
  - File: `Appendix H.pdf`
  - Companion `Appendix H.pdf.synthesis.md` contains: "Merkabit consulting engagement…"
  - Classified as: Merkabit → `Merkabit/business/Appendix H.pdf`
  - Without companion: would fall through to "No match"

  **Tip:** Run `synthesis enrich --type pdf` before routing to maximise companion coverage.

  ---

  ## Retention Policies

  | Workspace | Retention | Auto-Classify | Purpose |
  |-----------|-----------|---------------|---------|
  | Downloads | 30 days | ✅ Yes | Short-term staging, quick cleanup |
  | Screenshots | 90 days | ❌ No | Keep longer, manual review |

  **How retention works:**
  1. Files are indexed when scanned with an `expires_at` timestamp
  2. `StagingManager.findExpired()` uses `expires_at < NOW` (strict less-than — files expiring *exactly* now are NOT yet expired)
  3. After retention period passes, files become "expired"
  4. `staging expire` removes expired entries from index
  5. **Files remain on disk** (manual deletion if desired)

  **Special values:**
  - `retentionDays: 0` = **never expire** (stores NULL as `expires_at`; NULL rows always pass the expiry check)
  - `retentionDays: -1` = already expired immediately (useful in tests to force expiry)
  - The `<` predicate (not `<=`) means a file set to expire at exactly the current second survives one more cycle

  **Downloads cron — order matters:**
  ```bash
  # Correct: ingest new files, route them, then maintain index
  synthesis -d /home/totto/Downloads staging ingest && \
  synthesis -d /home/totto/Downloads staging route && \
  synthesis -d /home/totto/Downloads maintain
  # ⚠️ maintain alone does NOT process staged files
  ```

  ---

  ## Best Practices

  1. **Review staging weekly:**
     - Run `staging list` to see what's accumulated
     - Promote important files immediately
     - Let temporary files age out naturally

  2. **Use auto-classification:**
     - Downloads workspace automatically suggests destinations
     - Review suggestions before promoting

  3. **Don't promote everything:**
     - Only promote files you need long-term
     - Installers, temp files should age out

  4. **Combine with search:**
     - Use scoped search to find staged files: `synthesis search "invoice" --scope Downloads`
     - Then promote matches

  5. **Adjust retention as needed:**
     - Edit `.synthesis/config.yaml` to change `retentionDays`
     - Re-scan after config changes

  ---

  ## Integration with Regular Workspaces

  **Promotion flow:**
  ```
  Downloads (staging)
    ↓ classify
    ↓ review
    ↓ promote
  Documents (permanent)
    └── eXOReaction/
        └── clients/
            └── Elprint/
                └── [promoted file]
  ```

  **After promotion:**
  - File is moved (or copied) to destination
  - Source index entry is removed
  - Destination workspace is updated
  - Both indexes reflect the change

  ---

  ## Error Handling

  - **"Staging not configured"** — Add `staging:` section to workspace config
  - **"No routing rules defined"** — Either add `routing.rules` to config, or ensure `autoClassify: true` for content routing
  - **"No files found"** — Run `staging ingest` to register new files
  - **Promotion fails** — Check destination path exists, check permissions
  - **Classification confidence low / files stay unmatched** — Run `synthesis enrich --type pdf` first to populate companion files; then re-route
  - **Wrong org classified** — Check keyword index: `synthesis org list`; add/remove keywords from organization config

  ---

  ## Follow-up Actions

  After staging management:
  - "Want to search staged files?" -> Use scoped search with workspace
  - "Want to configure retention?" -> Edit `.synthesis/config.yaml`
  - "Want to see staging stats?" -> Run `staging stats`
  - "Need to bulk promote?" -> Script multiple `staging promote` commands
