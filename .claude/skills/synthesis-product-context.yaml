  ## Technical Architecture

  **Core:**
  - Apache Lucene for full-text indexing
  - SQLite for metadata and relationships
  - Bundled ffprobe (FFmpeg 7.0.2-static) for video metadata
  - Picocli for CLI interface
  - Jackson for JSON processing

  **Index Structure:**
  - `.synthesis/index/` - Lucene index
  - `.synthesis/config.yaml` - Configuration
  - `.synthesis/organizations.json` - Organization metadata

  **Supported Formats:**
  - Code: Java, Python, JavaScript, TypeScript, Go, Rust, etc.
  - Docs: Markdown, AsciiDoc, reStructuredText, plaintext
  - Media: MP4, AVI, MOV (metadata extraction)
  - Office: PDF, DOCX (coming soon)
  - Config: YAML, JSON, XML, properties

