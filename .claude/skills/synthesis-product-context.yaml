  ## AI Vision Enrichment Fix (Feb 17, 2026)

  **Problem:** Large images (>3.75 MB raw / >5 MB base64) silently failed Claude Vision API.
  NotebookLM exports (6-7 MB PNG) produced empty companion files with no AI descriptions.

  **Fix:** `ClaudeClient.readImageBytes()` auto-resizes oversized images before encoding:
  - Threshold: 3.75 MB raw (→ 5 MB base64 = API limit)
  - Resize: Downscale to fit 2048×2048, bilinear interpolation, re-encode as JPEG
  - Result: All 22 unnamed-*.png NotebookLM infographics (6-7 MB) now fully described
  - Validated: Knowledge graphs, system diagrams, AI paradox infographics all enriched

