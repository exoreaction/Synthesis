  ## MCP Server (v1.18.2)

  **43 tools** exposed over MCP to Claude Code, Cursor, and other AI agents.

  **Transports:**
  - **HTTP (recommended):** `synthesis-mcp-server --workspace /path --http-port 8765`
    - Health endpoint: `GET http://localhost:8765/health` → `{"status":"ok"}`
    - Claude Code config: `{ "type": "http", "url": "http://localhost:8765/mcp" }`
    - Survives session idle timeouts; run as systemd user service for persistence
  - **stdio:** `synthesis-mcp-server --workspace /path` (classic, subprocess spawned per session)

  **Tool Categories (41 total):**
  - **Search & Discovery (6):** search, relate, which, discover, diff, changed
  - **Architecture & Code (7):** graph, code-graph, architecture, knowledge-graph, trace, impact, cross-repo-deps
  - **Insights & AI (7):** ask, insights, perspectives, research, analyze, summary, report
  - **Content & Documentation (3):** export, enrich, explain
  - **Security & Quality (5):** security, health, validate, metrics, scatter
  - **Change Tracking (3):** changelog, track, status
  - **Operations (5):** stats, scan, maintain, mcp-stats, upcoming
  - **Workspace Intelligence (5):** describe, structure, evolution, naming, learn

  **Key new tools vs. original 8:**
  - `impact` - transitive blast radius before refactoring
  - `security` - vulnerability findings by severity
  - `trace` - shortest path between two files/symbols
  - `summary` - multi-perspective executive summary with caching
  - `report` - AI business reports (weekly/pipeline/activities/decisions)
  - `changelog`, `track` - file movement tracking with audit trail
  - `cross-repo-deps` - cross-repo dependency analysis
