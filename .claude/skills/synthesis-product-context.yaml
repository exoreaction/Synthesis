  ## Bundled Claude Code Skills (v1.4.1+, Feb 16, 2026)

  **Problem:** Users need to manually create skills to leverage Synthesis in Claude Code, creating friction.

  **Solution:** All 25 official Synthesis skills are now embedded in the JAR and can be exported with one command.

  ### Features
  1. **Zero Setup:** Skills bundled as JAR resources, no external downloads required
  2. **One Command Install:** `synthesis export-skills` installs all 25 skills instantly
  3. **Version Matched:** Skills always match your Synthesis version
  4. **Complete Coverage:** 80.6% command coverage (25 of 31 commands)
  5. **Skills Manifest:** JSON metadata for skill discovery and tooling

  ### Included Skills (25 total)

  **Core Workspace Operations (5):**
  - synthesis-workspace-management - init, scan, watch, update commands
  - synthesis-search-workspace - Full-text search with Lucene queries
  - synthesis-scoped-search - Search within specific sub-workspaces
  - synthesis-subworkspace-navigation - Navigate hierarchical structure
  - synthesis-relate-dependencies - Bi-directional relationship tracking

  **AI-Powered Features (4):**
  - synthesis-ask-workspace - AI Q&A about workspace content
  - synthesis-explain-code - AI code explanations (overview/detailed/expert)
  - synthesis-learn-skills - Auto-generate skills from workspace patterns
  - synthesis-perspectives-analysis - Multi-perspective directed synthesis

  **Analysis & Metrics (3):**
  - synthesis-insights-metrics - Codebase quality dashboard
  - synthesis-architecture-monitoring - Architecture drift detection
  - synthesis-graph-architecture - Visual dependency graphs (Mermaid)

  **Change Tracking (2):**
  - synthesis-track-movements - File movement tracking with audit trail
  - synthesis-changelog-reports - Cross-workspace change reporting

  **Media & Documentation (2):**
  - synthesis-enrich-media - Make videos/images/PDFs searchable
  - synthesis-export-docs - Generate documentation (multiple formats)

  **Staging & Workflow (1):**
  - synthesis-staging-management - Manage temporary/incoming files

  **Database & Release (2):**
  - synthesis-database-migrations - Schema management with Flyway
  - synthesis-release-manager - Release workflow automation

  **Context & Development (4):**
  - synthesis-product-context - Complete product knowledge
  - synthesis-development - Development guide
  - synthesis-context - General context
  - synthesis-interactive-cli - CLI usage patterns

  **Campaign Management (2):**
  - synthesis-linkedin-campaign - 9-week marketing campaign
  - synthesis-metrics-tracking - Usage analytics

  ### Export Commands
  ```bash
  # List all bundled skills
  synthesis export-skills --list

  # Export to default location (~/.claude/skills/)
  synthesis export-skills

  # Export to custom directory
  synthesis export-skills --output /path/to/skills

  # Overwrite existing skills
  synthesis export-skills --overwrite

  # Verbose output
  synthesis export-skills -v
  ```

  ### Distribution Strategy
  - **Users:** Run `synthesis export-skills` after installation → instant Claude Code integration
  - **Workshops:** One command to provision all skills for participants
  - **CI/CD:** Automated skill deployment in build pipelines
  - **Version Control:** Skills stay in sync with Synthesis updates

  ### Technical Implementation
  - **Storage:** `/src/main/resources/claude-skills/` in JAR (25 YAML/MD files + manifest)
  - **Manifest:** `skills-manifest.json` with version, categories, commands mapped
  - **Classpath Loading:** Skills read via `getResourceAsStream()` at runtime
  - **Size:** ~77KB total (2,289 lines of skill documentation)

