instructions: |
  # KCP (Knowledge Context Protocol) v0.25 — Synthesis Integration

  KCP is a structured YAML manifest format (`knowledge.yaml`) that tells AI agents
  which files matter, in what order to read them, and what each file is for.
  Synthesis provides full-stack KCP support: detection, parsing (through v0.21 fields),
  SQLite persistence, v0.25-conformant manifest generation (validated against kcp-agent),
  and knowledge-graph visualisation.

  **Spec repository:** https://github.com/cantara/knowledge-context-protocol
  **Synthesis PR series:** #284 (Phase 2) · #285 (Phase 3) · #286 (Phase 4) · #287 (Phase 5)

  ---

  ## knowledge.yaml Format (v0.25)

  ```yaml
  # Knowledge Context Protocol (KCP) v0.25
  kcp_version: "0.25"
  project: my-project
  language: en
  indexing: open

  hints:
    unit_count: 3

  units:
    - id: overview
      path: README.md
      intent: "What is this project and why does it exist?"
      scope: global
      audience: [developer, agent]
      format: markdown
      triggers: [overview, introduction, getting-started]
      validated: "2026-03-01"
      updated: "2026-03-01"
      content_structure:          # §4.19 (v0.17+): dominant modality
        primary: prose
        contains: [prose]
      content_hash:               # §4.21 (v0.18+): drift detection
        algorithm: sha256
        value: "…hex digest…"
      temporal:                   # §4.22 (v0.19+): from last git commit
        recorded_at: "2026-03-01T12:00:00+00:00"
      discovery:                  # §4.18 (v0.12+): epistemic status
        verification_status: declared
        source: synthesis

    - id: api-ref
      path: docs/api.md
      intent: "What endpoints does the API expose?"
      scope: module
      audience: [developer]
      format: markdown
      triggers: [api, rest, endpoints, http]
      kind: knowledge          # omit for default; use 'policy' for SECURITY/LICENSE/CONTRIBUTING
                               # use 'schema' for openapi.yaml / swagger / *-schema.json

  relationships:
    - from: api-ref
      to: overview
      type: context            # 'context', 'extends', 'summary_of'
  ```

  ### Field Reference

  | Field | Required | Values / Notes |
  |-------|----------|----------------|
  | `kcp_version` | Yes | Always `"0.25"` (quoted) |
  | `project` / `id` | Yes (one of) | Manifest identifier |
  | `language` | Recommended | ISO 639-1 code (`en`) |
  | `indexing` | Recommended | `open` = agent may index freely |
  | `hints.unit_count` | Recommended | Integer count of non-skipped units |
  | `units[].id` | Yes | Slug, unique within manifest |
  | `units[].path` | Yes | File path relative to manifest |
  | `units[].intent` | Yes | One-sentence answer to "what will I learn from this?" |
  | `units[].scope` | Recommended | `global` \| `module` \| `focused` \| `comprehensive` |
  | `units[].audience` | Recommended | `[developer]`, `[agent]`, `[developer, agent]` |
  | `units[].format` | Optional | `markdown`, `pdf`, `openapi`, `yaml`, `json-schema` |
  | `units[].kind` | Optional | Omit for knowledge (default); `policy` for legal/governance; `schema` for APIs |
  | `units[].triggers` | Optional | Up to 8 keywords that should activate this unit |
  | `units[].validated` | Optional | Quoted ISO date string (YYYY-MM-DD) |
  | `units[].updated` | Optional | Quoted ISO date string |

  ---

  ## Generate a manifest (synthesis export --format kcp)

  Generates a conformant `knowledge.yaml` from the Lucene index. No AI, no DB — pure index.

  ```bash
  # Generate from all MARKDOWN files (default filter)
  synthesis -d /path/to/repo export --format kcp -o knowledge.yaml

  # Include code files too
  synthesis -d /path/to/repo export --format kcp --type CODE -o knowledge.yaml

  # Alias
  synthesis -d /path/to/repo export --format knowledge-context-protocol -o knowledge.yaml
  ```

  ### What the exporter infers automatically

  | Field | Inference rule |
  |-------|---------------|
  | `format` | `.md`/`.mdx`/`.markdown` → `markdown`; `.pdf` → `pdf`; `openapi.yaml` / `swagger.*` / `asyncapi.*` → `openapi`; `*-schema.json` → `json-schema`; `.yaml`/`.yml` → `yaml`; code files → omitted |
  | `kind` | `SECURITY.md`, `LICENSE.md`, `CONTRIBUTING.md`, `PRIVACY.md`, `TERMS.md`, `NOTICE.md`, `*POLICY*` → `policy`; `openapi.yaml`, `swagger.*`, `*-schema.json` → `schema`; everything else → omitted (default `knowledge`) |
  | `intent` | First non-empty sentence of the indexed summary |
  | `scope` | Depth-based: root → `global`, depth 1-2 → `module`, depth 3+ → `focused` |
  | `audience` | MARKDOWN/PDF → `[developer]`; CODE/YAML/CONFIG → `[developer]` |
  | `triggers` | Top-8 heading words slugified (stop-words removed) |
  | `validated` | Last-modified timestamp of the file (quoted ISO date) |
  | `updated` | Same as validated |
  | `content_structure` | `primary`/`contains` modality: CODE → `code`, YAML/JSON/CONFIG → `reference`, else `prose` |
  | `content_hash` | `sha256` hex digest of the file bytes; omitted when the file is unreadable |
  | `temporal.recorded_at` | ISO timestamp of the file's most recent git commit (one-pass `git log`, capped at 5000 commits); omitted outside git repos |
  | `discovery` | `verification_status: declared`, `source: synthesis` (first-party self-description; v0.16 epistemic ordering) |

  ---

  ## Detection & parsing (synthesis scan / maintain)

  When Synthesis scans a workspace, `YamlAnalyzer` detects files matching ALL THREE:
  1. filename is `knowledge.yaml`
  2. top-level key `units` is a list
  3. top-level key `project` or `id` exists

  Detected manifests get `yamlType = "kcp-manifest"` in `AnalysisResult.metrics()`.
  Full unit data (id, path, intent, scope, audience, triggers, hints) is extracted into
  `KcpUnit` records. Relationship data goes into `KcpRelationship` records.

  ---

  ## Database persistence (V17 tables, extended V22–V23)

  Four SQLite tables (Flyway V17 + V22 v0.21 fields + V23 v0.25 federation/extensions):

  | Table | Purpose |
  |-------|---------|
  | `kcp_manifests` | One row per `knowledge.yaml` (project, kcp_version, counts, signing, discovery, `root_extensions_json`) |
  | `kcp_units` | One row per unit (intent, scope, temporal, content_hash, discovery, `extensions_json`) |
  | `kcp_relationships` | One row per relationship (from_unit, to_unit, type) |
  | `kcp_federation` | One row per root `manifests[]` entry (url, relationship, context, version pin, temporal, agent_identity) |

  Unmapped root/unit blocks (auth, payment, rate_limits, freshness_policy, composition,
  visibility, authority, ...) are preserved losslessly as raw JSON in the `*_extensions_json`
  columns, so future spec waves degrade gracefully instead of being dropped.

  `synthesis kg` badges `[EXPIRED]`/`[SUPERSEDED by x]` units, shows `verification_status`,
  lists federation entries, and reports K-series health signals (`KcpHealthChecks`):
  K001 expired-unit-referenced, K002 supersession cycle (HIGH), K003 gitignored manifest (HIGH),
  K004 freshness_policy violation (severity from `on_stale`).

  Managed by `KcpRepository` (in `io.exoreaction.synthesis.kcp`):
  - `upsertFromAnalysis(conn, workspacePath, metadata, analysis)` — idempotent upsert
  - `deleteForManifest(conn, workspacePath, filePath)` — removes manifest + units + rels
  - `getManifests()`, `getUnitsForManifest()`, `getRelationshipsForManifest()` — query methods

  Hooks fire automatically: `ScanCommand` after each YAML file analysis; `MaintainCommand`
  after changed/added file analysis and on deleted `knowledge.yaml` files.

  ---

  ## Knowledge graph (synthesis kg)

  KCP units surface as first-class nodes in all three `synthesis kg` output formats:

  ### ASCII (default)
  ```
  KCP Knowledge Units:
  ----------------------------------------
    [my-project]
      • overview: What is this project and why does it exist?
        → README.md  [scope: global]
        triggers: overview, introduction, getting-started
      • api-ref: What endpoints does the API expose?
        → docs/api.md  [scope: module]

    Relationships:
      api-ref --[context]--> overview
  ```

  ### Mermaid
  Units appear as pill-shaped nodes `("project/unitId\nintent")` linked to their
  source directory via `kcp-unit` edges, and to each other via typed relationship edges.

  ```
  synthesis kg --format mermaid
  ```

  ### JSON
  ```json
  {
    "kcpUnits": [
      {"unitId": "overview", "project": "my-project", "path": "README.md", ...}
    ],
    "kcpRelationships": [
      {"from": "api-ref", "to": "overview", "type": "context", ...}
    ]
  }
  ```

  ---

  ## Scope filtering

  `synthesis kg --scope eXOReaction` applies the same scope filter to KCP units:
  only units whose `manifest_file` path starts with the scope prefix are included.

  ---

  ## Validate a manifest

  After generation, validate with the reference consumer (pinned version — same as CI):
  ```bash
  npx --yes kcp-agent@0.19.0 validate knowledge.yaml
  ```

  Or with the KCP Python reference parser:
  ```bash
  pip install kcp
  python3 -m kcp knowledge.yaml
  ```

  CI runs the kcp-agent validation automatically for export-related changes
  (`.github/workflows/kcp-conformance.yml`).

  ---

  ## Scaffold manifests from repo structure (synthesis kcp init)

  Works on any repository directory — no index required (unlike `export --format kcp`):

  ```bash
  synthesis kcp init [dir]              # scaffold knowledge.yaml (default: workspace root)
  synthesis kcp init --batch /src/org   # every direct child git repo missing a manifest
  synthesis kcp init --dry-run          # print without writing
  ```

  Detects README/docs/policy markdown (intent from first heading, triggers from
  headings), Maven `<modules>` (comments stripped), `.github/workflows` (ci unit),
  and `src/test` (tests unit). Emits the same v0.25 evidence fields as the exporter
  (content_hash, content_structure, temporal.recorded_at from git, discovery:
  declared). Output validates against kcp-agent with 0 warnings.

  **Never overwrites** an existing knowledge.yaml. Generated manifests carry
  `hints.generated_by: synthesis@<version>` — the marker that authorises future
  automated refresh; hand-authored manifests lack it and are left alone. Warns
  when the written manifest would be gitignored (#309).

  ## Keep generated manifests fresh (synthesis kcp refresh)

  ```bash
  synthesis kcp refresh [dir]            # refresh one repo's generated manifest
  synthesis kcp refresh --batch /src/org # all child git repos
  synthesis kcp refresh --dry-run        # report only
  ```

  Rewrites ONLY manifests carrying the `generated_by: synthesis@…` marker, and only
  when nothing but volatile fields (dates, content hashes, git timestamps) changed —
  detected by comparing the volatile-normalized existing manifest against a fresh
  scaffold. Three protections: hand-authored manifests (no marker) are never touched;
  structurally hand-edited generated manifests are reported and left alone; drift on
  protected manifests is managed by `kcp verify` instead.

  ## Federate an estate (synthesis kcp catalog / federate)

  Turn a directory of repos-with-manifests into standard distribution artifacts any
  KCP consumer (incl. kcp-agent) can navigate:

  ```bash
  synthesis kcp catalog /src/org -o catalog.yaml   # catalog.yaml (catalog spec v0.1)
  synthesis kcp federate /src/org --write          # root knowledge.yaml with manifests[]
  ```

  - **catalog**: one cartridge per child repo carrying knowledge.yaml — `name`, git
    `source` (`git+https://…//knowledge.yaml@<tag|sha>`), `version` (git tag or manifest
    version), `source_commit`, and `depends_on` from cross-repo edges.
  - **federate**: root `knowledge.yaml` whose `manifests[]` lists each repo (TLS `url`,
    `relationship`, `local_mirror`, `context` from the org registry) with
    `external_relationships` from the dependency edges. Validates with kcp-agent.

  Cross-repo `depends_on`/`external_relationships` are derived deterministically from
  Maven `<dependency>` artifactIds + each manifest's own `manifests[]` declarations.
  Cycles are detected and dropped (reported, never emitted). Estates over 50 repos are
  sharded into `knowledge.shard-N.yaml` files referenced from the top root, so no
  manifest exceeds the follower's 50-manifest ceiling.

  ## Plan a read order for a task (synthesis kcp plan / plan_context MCP)

  ```bash
  synthesis kcp plan "how does authentication work" --budget 4000 --format json
  ```

  Deterministic RFC-0007 scoring over indexed units — no model, no Node: trigger match
  5pts, intent 3pts, id/path 1pt. Returns an ordered plan (unit, match reason, token
  estimate) with expired/superseded units skipped and an optional token budget. The
  same engine backs the `plan_context` MCP tool, which returns an ordered read plan
  instead of flat search hits. kcp-agent's own `plan`/`replay` run over
  Synthesis-generated manifests in CI (`kcp-conformance.yml`).

  ## Verify declarations against evidence (synthesis kcp verify)

  KCP fields are declarations; `synthesis kcp verify` checks them deterministically
  (no model) against filesystem, content, and git history — the epistemic upgrade
  path `declared → observed`:

  ```bash
  synthesis kcp verify                    # all indexed manifests (scan first)
  synthesis kcp verify --manifest path    # suffix match
  synthesis kcp verify --format json      # machine-readable; exit 1 on HIGH findings → CI gate
  ```

  | Check | Severity | Meaning |
  |-------|----------|---------|
  | V001 MISSING_PATH | HIGH | unit path does not exist on disk |
  | V002 HASH_MISMATCH | HIGH | content_hash ≠ recomputed sha256 (file changed after declaration) |
  | V003 STALE_DECLARATION | MEDIUM | source has git commits after declared updated/validated |
  | V004 DEAD_TRIGGER | LOW | trigger matches neither headings nor content (markdown) |
  | V005 DANGLING_REFERENCE | HIGH | relationship/supersession/depends_on target missing |
  | V006 TEMPORAL_INVALID | HIGH | valid_from after valid_until |
  | K001/K002/K004 | — | K-series health signals folded in |

  Per-unit verdicts (observed/stale/contradicted) are persisted to `kcp_verification`
  (V24) BESIDE the manifest's declared verification_status — re-scans never clobber them.

  ## Find coverage gaps (synthesis kcp gaps)

  ```bash
  synthesis kcp gaps --limit 25   # hot files (git churn) with no KCP unit; requires hotspots --refresh
  ```

  Ranks by hotspot score, annotates module fan-in when the code graph knows it, and
  filters Synthesis internals/VCS metadata.

  ## Sign & govern (synthesis kcp sign + G-series)

  Two trust layers, both surfaced through `kcp verify`:

  ```bash
  synthesis kcp sign knowledge.yaml            # Ed25519 detached signature → knowledge.yaml.sig
  synthesis kcp sign knowledge.yaml --verify   # trust tier: TRUSTED/KNOWN/UNSIGNED/FAILED
  synthesis kcp init --sign                    # sign at generation time
  ```

  - **Tamper-evidence (kcp-agent-interoperable)**: `kcp sign` writes a raw-Ed25519 signature over
    the exact manifest bytes — a top-level `signing:` block (`scheme`/`key_id`/`public_key`/
    `signature`) in the manifest plus a detached `knowledge.yaml.sig` holding the Cantara envelope
    `{algorithm, key_id, public_key, signature}`. kcp-agent verifies it directly
    (`plan --require-signature` → "ed25519 signature verified (declared key)"), and CI proves both
    directions (accepts a Synthesis signature, rejects a tampered one). Keys live in
    `~/.synthesis/kcp-keys/` (`<kid>.pub` allowlist, `<kid>.key` private, `0600`, never written into
    a manifest/log/export). Any edit after signing flips the tier to FAILED; `kcp verify` fires
    **K005** on a failed signature.
  - **Governance cross-check** (the differentiator — Synthesis holds both the manifest and a
    CKG-5 security scan over the same files): `kcp verify` folds in **G001** (`sensitivity: public`
    on a file with a HIGH security finding), **G002** (`authority.share_externally` under a
    `compliance.data_residency` restriction), **G003** (`visibility` scope unknown to the org
    registry).

  The full trustworthy-context story = **verify (evidence-backed) + sign (tamper-evident) +
  govern (declarations match reality)**. Run `synthesis kcp verify` after `sign` for all three.

  ## Use cases

  1. **Bootstrap agent navigation** — generate `knowledge.yaml` in a new repo so agents know
     load order without needing to scan the whole codebase:
     ```bash
     synthesis -d /path/to/repo export --format kcp -o knowledge.yaml
     ```

  2. **Audit KCP coverage** — see which documented repos have manifests:
     ```bash
     synthesis kg --format json | jq '.kcpUnits | group_by(.project) | map({project: .[0].project, units: length})'
     ```

  3. **Cross-repo relationships** — after scanning a multi-repo workspace, `synthesis kg` shows
     how KCP units in different repos relate to each other.

  4. **MCP discovery** — the `synthesis knowledge-graph` MCP tool returns kcpUnits and
     kcpRelationships in its JSON response, letting agents reason about manifest structure.

