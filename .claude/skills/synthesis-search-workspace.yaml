  | **cantara** | `/src/cantara` | 7,990 | Cantara open source (54 repos, Java) |
  | **quadim** | `/src/quadim` | 6,999 | Quadim platform (38 repos, Java) |
  | **elprint** | `/src/elprint` | 4,282 | Elprint client (mixed) |
