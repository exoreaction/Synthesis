instructions: |
  # Synthesis Search Workspace

  **Purpose:** Search across all indexed files in a Synthesis workspace using full-text Lucene queries.
  **Performance:** Sub-second search (<1s typical, 0.4s validated) across 38,000+ files across all workspaces.

  ---

  ## CRITICAL: Choose the Right Workspace

  **Always specify `-d <workspace>` — without it, synthesis defaults to `~/Documents` (business docs only).**

  | What you're looking for | Use |
  |---|---|
  | Source code (Java, classes, methods) | `synthesis search -d /src/exoreaction "query"` |
  | Cantara open source code | `synthesis search -d /src/cantara "query"` |
  | Quadim platform code | `synthesis search -d /src/quadim "query"` |
  | Elprint client code | `synthesis search -d /src/elprint "query"` |
  | Business docs, pipeline, clients, strategy | `synthesis search "query"` (defaults to ~/Documents) |
  | Everything everywhere | `synthesis search --all "query"` |

  **Lesson learned (benchmark Feb 19, 2026):** 10/10 synthesis search calls returned wrong results
  because agents omitted `-d /src/exoreaction`. The source IS indexed — just needs the right flag.
  Issue #85 filed for auto-detection.

  **⚠️ Two different paths — easy to confuse:**
  - Synthesis workspace root: `/src/exoreaction` ← use this with `-d` (has `.synthesis/` index)
  - Project source tree: `/home/totto/src/exoreaction/Synthesis/` ← for file reads/edits (no index)
  - `/home/totto/src/exoreaction/` has NO `.synthesis/` → "Not a Synthesis workspace" exit code 1

  **Verify search will work before relying on it:**
  ```bash
  synthesis search -d /src/exoreaction "test" 2>/dev/null | head -3
  # Should show "X results for: test" — if not, wrong path or index missing
  ```

  **Parallel search:** ✅ Fixed in 1.10.0 (#86) — `SearchIndex.openReadOnly()` uses
  `DirectoryReader` with no write.lock. Multiple agents can now search the same index
  simultaneously without contention.

  ---

  ## Command Syntax

  ```bash
  synthesis -d <workspace> search "<query>" [options] 2>/dev/null
  # OR (short form, same result):
  synthesis search -d <workspace> "<query>" [options] 2>/dev/null
  ```

  **Important:** Always add `2>/dev/null` to suppress SLF4J and pilot approval stderr noise.

  ### Options
  - `--type TYPE` - Filter: MARKDOWN, CODE, YAML, JSON, CONFIG, PDF, IMAGE, VIDEO, AUDIO
  - `--limit N` - Maximum results (default: 20)
  - `--verbose` / `-v` - Show file size, modification date, language
  - `--scope NAME` - Search within sub-workspace (eXOReaction, Quadim, etc.)
  - `--aggregate` - Group results by sub-workspace
  - `--all` - Search ALL workspaces simultaneously
  - `--company NAME` - Filter to organization (eXOReaction, Quadim, Cantara)
  - `--repo NAME` - Filter to specific repository

  ---

  ## All Available Workspaces

  | Workspace | Path | Files | Content |
  |---|---|---|---|
