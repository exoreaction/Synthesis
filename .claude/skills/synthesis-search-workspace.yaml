  Run `synthesis list` to see current state of all workspaces.

  ---

  ## Common Search Patterns

  ### Source code — find a class or method
  ```bash
  synthesis search -d /src/exoreaction "SearchCommand" 2>/dev/null
  synthesis search -d /src/exoreaction "isAnchorDoc" 2>/dev/null
  synthesis search -d /src/exoreaction "RetentionPolicy" --type CODE 2>/dev/null
  ```

  ### Source code — understand a feature
  ```bash
  synthesis search -d /src/exoreaction "multi-pass report" 2>/dev/null
  synthesis search -d /src/exoreaction "staging ingest route" 2>/dev/null
  ```

  ### Business docs — pipeline and clients
  ```bash
  synthesis search "SpareBank pipeline" 2>/dev/null
  synthesis search "Mynder retainer" 2>/dev/null
  synthesis search "isAnchorDoc" 2>/dev/null   # finds docs workspace mentions
  ```

  ### Cross-workspace — find anything everywhere
  ```bash
  synthesis search --all "anchor document" 2>/dev/null
  synthesis search --all "retention policy" 2>/dev/null
  ```

  ### Scoped within sub-workspace
  ```bash
  synthesis search "workshop" --scope eXOReaction 2>/dev/null
  synthesis search "README" --aggregate 2>/dev/null  # grouped by sub-workspace
  ```

  ### Code with type filter
  ```bash
  synthesis search -d /src/exoreaction "dependency injection" --type CODE --limit 10 2>/dev/null
  ```

  ---

  ## Query Syntax (Lucene)

  | Pattern | Example | Description |
  |---|---|---|
  | Simple term | `authentication` | Files containing "authentication" |
  | Exact phrase | `"NCI Protocol"` | Exact phrase match |
  | Boolean AND | `testing AND strategy` | Both terms required |
  | Boolean OR | `Java OR Kotlin` | Either term matches |
  | NOT | `testing NOT unit` | Exclude term |
  | Wildcard | `test*` | Prefix matching |
  | Fuzzy | `autentication~` | Typo-tolerant |

  ---

  ## Error Handling

  - **No results / wrong results** — Wrong workspace! Check table above and add correct `-d` flag
  - **"Index not found"** — Run `synthesis -d <path> scan` to build index
  - **"Workspace not initialized"** — Run `synthesis -d <path> init` first
  - **SLF4J warnings on stderr** — Normal, suppress with `2>/dev/null`

  ---

  ## Follow-up Actions

  - "Relationships for this file?" → `synthesis relate <file>`
  - "What changed recently?" → `synthesis changelog`
  - "Read the file?" → Use Read tool on the path shown in results
  - "Which workspace owns this file?" → `synthesis which <filename>`

