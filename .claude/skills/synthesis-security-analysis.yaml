  ## Testing

  Three test classes cover CKG-5 (40 tests total):

  | Class | Tests | What it covers |
  |-------|------:|---------------|
  | `SecurityRepositoryTest` | 9 | CRUD for all 3 security tables, workspace isolation |
  | `SecurityAnalyzerTest` | 21 | Per-signal detection (trigger + non-trigger for each signal) |
  | `DependencyInventoryExtractorTest` | 10 | pom.xml parsing, CVE catalog, version matching |

  Run security tests only:
  ```bash
  mvn test -pl . -Dtest="Security*,DependencyInventory*" -q
  ```

