instructions: |
  # Synthesis Security Analysis (CKG-5)

  `synthesis code-graph security` — 21-signal static analysis of Java source workspaces.
  Covers both traditional security signals and agentic AI-specific risks unique to
  AI-powered codebases. Part of v1.14.0-SNAPSHOT (PR #234, Feb 2026).

  ---

  ## Quick Commands

  ```bash
  # Run full analysis on a workspace:
  synthesis code-graph security -d /src/exoreaction/Synthesis

  # High severity only:
  synthesis code-graph security -d /src/... --severity HIGH

  # Re-analyze (fresh scan, not cached):
  synthesis code-graph security -d /src/... --refresh

  # Show specific signal type:
  synthesis code-graph security -d /src/... --type S010_DEPENDENCY_KNOWN_VULN

  # Attack surface map (entry points → sinks):
  synthesis code-graph security -d /src/... --attack-surface

  # JSON output for CI:
  synthesis code-graph security -d /src/... --format json

  # Scan all files for secrets (not just Java):
  synthesis code-graph security -d /src/... --scan-secrets
  ```

  ---

  ## Signal Reference

  ### Traditional Security

  | Signal | Severity | CWE | What it detects |
  |--------|----------|-----|----------------|
  | S001_SQL_INJECTION | HIGH | CWE-89 | String concatenation in SQL context |
  | S002_HARDCODED_SECRET | HIGH | CWE-798 | Passwords/API keys/tokens in string literals |
  | S003_WEAK_CRYPTO | MEDIUM | CWE-327 | MD5 or SHA-1 usage |
  | S004_INSECURE_RANDOM | MEDIUM | CWE-330 | java.util.Random in security-sensitive context |
  | S005_XXE_VULNERABILITY | HIGH | CWE-611 | DocumentBuilderFactory without FEATURE_SECURE_PROCESSING |
  | S006_PATH_TRAVERSAL | HIGH | CWE-22 | Unvalidated user-supplied path construction |
  | S007_UNSAFE_DESERIALIZATION | HIGH | CWE-502 | ObjectInputStream without ObjectInputFilter |
  | S008_SSRF | HIGH | CWE-918 | User-controlled HTTP request target |
  | S009_EXPOSED_INTERNAL | MEDIUM | CWE-200 | Internal API accessible via public endpoint |
  | S010_DEPENDENCY_KNOWN_VULN | HIGH | CWE-1035 | Declared dependency matches CVE catalog |
  | S011_OVERLY_BROAD_CATCH | LOW | CWE-396 | catch(Exception) or catch(Throwable) |
  | S012_OPEN_REDIRECT | HIGH | CWE-601 | User-controlled redirect destination |
  | S013_TEMP_FILE_RACE | LOW | CWE-377 | java.io.File.createTempFile race condition |
  | S014_LOG_INJECTION | MEDIUM | CWE-117 | User input in log statement without sanitization |

  ### Agentic AI-Specific

  | Signal | Severity | CWE | What it detects |
  |--------|----------|-----|----------------|
  | S015_ATTACK_SURFACE_ENTRY | INFO | — | CLI command classes (inventory of entry points) |
  | S016_DIRECT_PROMPT_INJECTION | HIGH | CWE-1426 | User param flows into prompt construction |
  | S017_RAG_POISONING | HIGH | CWE-1426 | Search results → prompt without sanitization |
  | S018_UNCONFIRMED_AGENTIC_ACTION | HIGH | CWE-1426 | Destructive action without dryRun guard |
  | S019_UNVALIDATED_AGENTIC_PATH | HIGH | CWE-22 | Agent-supplied path without startsWith check |
  | S020_TOOL_RESULT_INJECTION | HIGH | CWE-1426 | Tool result in LLM context without boundary |
  | S021_MISSING_PROMPT_BOUNDARIES | HIGH | CWE-1426 | Prompt template lacks `<system>`/`<user>` tags |

