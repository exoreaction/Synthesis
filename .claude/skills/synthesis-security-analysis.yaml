  ## Known False Positives

  These patterns trigger detectors but are not real vulnerabilities:

  | Signal | False Positive Pattern | How to Recognize |
  |--------|----------------------|-----------------|
  | S001 | SQL string building with internal constants | `"DELETE FROM " + tableName` where tableName is an enum/constant, not user input |
  | S002 | Regex patterns used to DETECT secrets | `"-----BEGIN.*PRIVATE KEY"` in a SecurityAnalyzer class |
  | S002 | Test fixture values | `"dummy_test_value"` or `"test123"` in test classes |
  | S010 | Dependency inside XML comment block | `<!-- <dependency>commons-text 1.9</dependency> -->` — commented-out deps are NOT built |
  | S015 | All CLI entry points | Informational only — listing attack surface, not flagging vulnerabilities |

  **S001 false positive rate: ~50%.** The checker fires on any string concatenation near
  SQL keywords regardless of whether user input flows in. Fix path: taint tracking
  (future improvement — filed as potential enhancement).

  **S010 XML comments (fixed in v1.14.0, commit 11edd4e):** `parsePomDependencies()` now
  strips `<!-- ... -->` blocks before matching dependency tags. Pre-fix: Cantara/reactiveservices
  `commons-text:1.9` was flagged as Text4Shell RCE (CVE-2022-42889) despite being commented out.

  ---

  ## Dependency CVE Catalog (S010)

  `DependencyInventoryExtractor` parses `pom.xml` files and compares against
  `known-vulnerabilities.json` (embedded in the JAR):

  | CVE | Artifact | Fixed version |
  |-----|----------|--------------|
  | CVE-2021-44228 | log4j-core | 2.17.1 (Log4Shell RCE) |
  | CVE-2022-42889 | commons-text | 1.10.0 (Text4Shell RCE) |
  | CVE-2022-42003 | jackson-databind | 2.13.2 |
  | CVE-2022-22965 | spring-webmvc | 5.3.18 (Spring4Shell) |
  | CVE-2021-22119 | spring-security-core | 5.4.9 |

  **Version matching:** `KnownVulnerability.matches(dep)` — semantic version comparison,
  `dep.version < vuln.fixedVersion`. Null versions are never flagged.

  ---

  ## Attack Surface Map (--attack-surface)

  BFS traversal from CLI entry points (S015 detected classes) through `code_dependencies`
  to security-sensitive sinks. Each path shows:
  - `entryClass → sinkClass [sinkType] (N hops)`
  - `sinkType`: file-io, sql, network, ai, deserialization

  **Synthesis example:**
  ```
  Attack Surface (1,092 paths)
    AskCommand → ClaudeClient [ai] (1 hops)
    AskCommand → SearchIndex [file-io] (1 hops)
    AskCommand → CredentialStore [file-io] (2 hops) via ClaudeClient
  ```

  High hop count (3+) = deep path through system = harder to trace, higher risk.

  ---

  ## Workflow: Portfolio Security Audit

  ```bash
  # 1. Quick high-severity pass across all workspaces (run sequentially — SQLite lock):
  for ws in /src/elprint /src/quadim /src/cantara /src/exoreaction; do
    echo "=== $(basename $ws) ===" && \
    synthesis code-graph security -d $ws --severity HIGH 2>&1 | grep -E "Security Findings|^\s+\[HIGH\]" | head -20
  done

  # 2. Check CVEs specifically:
  synthesis code-graph security -d /src/cantara --type S010_DEPENDENCY_KNOWN_VULN

  # 3. Deep agentic audit of AI-powered tools:
  synthesis code-graph security -d /src/exoreaction/Synthesis --severity HIGH

  # 4. JSON for tooling integration:
  synthesis code-graph security -d /src/... --format json 2>&1 | tail -n +2 > findings.json
  # Note: skip first line (pilot approval message) with tail -n +2 before JSON parsing
  ```

  **SQLite lock warning:** Do NOT run multiple workspaces in parallel — use sequential execution.
  Parallel runs produce `[SQLITE_BUSY]` errors.

