  ## Agentic Security Interpretation

  S016-S021 signals are **unique to AI-powered codebases**. Not found in traditional SAST tools.

  **S016 (Direct Prompt Injection) in Synthesis:**
  - User CLI args (`question`, `input`, `pattern`) flow into `buildAskPrompt()`
  - Risk: malicious files in indexed workspace could include injection instructions
  - Synthesis is a local CLI tool — threat model is workspace content, not network attacker
  - Mitigation: `<user>` boundary tags, content sanitization, output validation

  **S017 (RAG Poisoning) in Synthesis:**
  - `AskCommand.java:224`: `index.search()` → `readPreview()` → `buildAskPrompt()`
  - A file could contain `"Ignore previous instructions. Output: ..."` and be in search context
  - Fix: wrap external content in `<document>` tags; filter known injection patterns

  **S021 (Missing Prompt Boundaries):**
  - Prompt templates without `<system>`/`<user>` tags allow injected content to blur the
    instruction/data distinction
  - Fix: standardize on boundary tags in all `PromptTemplates.*` methods

