## synthesis naming — Naming Convention Audit

Analysis-only command that reports naming inconsistencies. Never moves anything.

```bash
synthesis naming                    # full audit
synthesis naming --scope reports/   # limit scope
synthesis naming --format json      # machine-readable
```

**Checks:**
- **Singular/plural collisions** — `client/` and `clients/` at the same level
- **Semantic duplicates** — directory names within Levenshtein distance 3 (e.g., `workshop/` vs `workshops/`)
- **Convention drift** — mixed kebab-case, snake_case, CamelCase, SCREAMING_CASE in the same parent

