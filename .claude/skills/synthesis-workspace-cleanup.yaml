## synthesis ttl — File TTL Rules

Register glob-pattern rules that declare when specific files should be cleaned up.

```bash
# Register a rule
synthesis ttl set "TONIGHT-*.md" --days 3
synthesis ttl set "finish-overnight.sh" --days 7

# List active rules
synthesis ttl list

# Check what's expired (dry-run)
synthesis ttl check

# Move expired files to archive
synthesis ttl check --archive
```

Rules are stored in `.synthesis/ttl-rules.yaml`. Pattern is a glob (e.g., `TONIGHT-*.md`,
`*.tmp`). Expiry = `createdAt + days`. Root-level files only.

**YAML format:**
```yaml
rules:
  - pattern: "TONIGHT-*.md"
    days: 3
    createdAt: "2026-02-20"
  - pattern: "finish-overnight.sh"
    days: 7
    createdAt: "2026-02-20"
```

---

## synthesis archive audit — Duplicate and Space Audit

Audits the `archive/` directory for space savings opportunities.

```bash
synthesis archive audit            # full audit
synthesis archive audit --top 20   # show top 20 large directories
synthesis archive audit --format json
synthesis archive audit --manifest archive-report.md  # write report to file
```

**Reports:**
- **Duplicate files** — identical content (SHA-256), shows wasted space
- **Build artifacts** — `target/`, `node_modules/`, `__pycache__/`, `.gradle/` in archive
- **Largest directories** — sorted by size, with file counts

---

## Recommended Workflow

```bash
# 1. Health check first
synthesis health

# 2. Fix config issues
synthesis health --fix-config

# 3. Remove empty directories
synthesis prune --yes

# 4. Archive stale root files (dry-run first)
synthesis sweep --dry-run
synthesis sweep --yes

# 5. Check TTL-ruled files
synthesis ttl check --archive

# 6. Find fragmented entities
synthesis scatter --all

# 7. Consolidate top offender
synthesis consolidate "Entity Name" --execute

# 8. Audit archive for space savings
synthesis archive audit
```

