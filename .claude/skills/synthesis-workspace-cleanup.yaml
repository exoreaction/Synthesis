## synthesis scatter — Find Fragmented Entity Directories

Detects when content about the same entity is spread across multiple locations.

```bash
synthesis scatter "Item Consulting"   # check one entity
synthesis scatter --all               # scan entire workspace (top 20 by file count)
synthesis scatter --all --top 10      # limit results
synthesis scatter --all --min-files 3 # only report entities with ≥3 files per location
```

**Output example:**
```
  Item Consulting — 3 locations (47 files total)
    marketing/item-consulting/     (23 files)
    business/item-consulting/      (18 files)
    prospects/item-consulting/     (6 files)
  → Consider: synthesis consolidate "Item Consulting"
```

Detection logic: normalizes entity names (camelCase, hyphen, space → common form),
uses Levenshtein distance ≤ 2 for fuzzy matching across directory names.

---

## synthesis consolidate — Merge Fragmented Entity Directories

Action companion to `synthesis scatter` — moves fragmented directories to a single
canonical location.

```bash
synthesis consolidate "Item Consulting"           # dry-run preview
synthesis consolidate "Item Consulting" --execute  # actually move files
synthesis consolidate "Item Consulting" --target clients/ItemConsulting  # explicit destination
synthesis consolidate "Item Consulting" --symlinks  # leave symlinks at old locations
```

**Target resolution (auto):**
1. If a `clients/` or `company/clients/` directory exists → `clients/<CamelCase>/`
2. Otherwise → parent of the largest source directory

**Cross-reference updates:** After moving, scans all `.md` files for links to old paths
and rewrites them to the new path (skips hidden dirs).

**Migration script:** Use `--dry-run` (default) to generate a bash script showing
all `mkdir -p` + `mv` operations before executing.

