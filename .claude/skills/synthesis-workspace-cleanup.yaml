name: synthesis-workspace-cleanup
description: >
  Use this skill when you need to audit, clean up, or reorganize a Synthesis workspace.
  Covers health checks, empty-directory pruning, stale-file archival, entity fragmentation
  analysis, naming convention audits, TTL rules, and archive auditing.

---

# Synthesis Workspace Cleanup Commands

Synthesis v1.11.0 ships a suite of hygiene commands for keeping knowledge workspaces tidy.
All commands support `--dry-run` and are non-destructive by default.

---

## synthesis health — Workspace Health Audit

Audits the workspace and reports a health score (0–100).

```bash
synthesis health                # audit only (read-only)
synthesis health --fix-config   # auto-fix phantom sub-workspace paths in config
synthesis health --format json  # machine-readable output
```

**Checks performed:**
| Code | Severity | Description |
|------|----------|-------------|
| E001 | ERROR    | Phantom sub-workspaces (configured paths that don't exist) |
| E002 | ERROR    | Build artifacts at root (target/, node_modules/, __pycache__/) |
| W001 | WARNING  | Empty directories (no files anywhere in subtree) |
| W002 | WARNING  | ≥5 loose root-level files (not dirs, not hidden) |
| I001 | INFO     | Archive percentage (large archive/ dirs noted) |

**Score formula:** `100 − 15 × errors − 5 × warnings`
**Grades:** A (90+), B (75+), C (60+), D (40+), F (<40)

**`--fix-config`**: fuzzy-matches phantom paths against actual directories using
Levenshtein distance (≤ 3 chars), updates `.synthesis/config.yaml` in-place via
raw YAML map mutation (preserves comments).

---

## synthesis prune — Remove Empty Directories

Recursively removes directories that contain no regular files (anywhere in subtree).

```bash
synthesis prune             # scan only — shows what would be removed
synthesis prune --dry-run   # explicit dry-run (same as default)
synthesis prune --yes       # prune without prompting
synthesis prune --path reports/  # limit to a sub-path

# Safety exclusions (always skipped):
# - Dot-directories (.git, .synthesis, etc.)
# - Directories containing a README.md
# - Paths referenced in config sub-workspaces
```

Directories are removed deepest-first to allow parent removal in the same pass.

---

## synthesis sweep — Archive Stale Root-Level Files

Identifies and archives stale files at the workspace root level.

```bash
synthesis sweep --dry-run          # preview (shows ROUTABLE and ARCHIVE groups)
synthesis sweep --days 14          # lower age threshold (default: 30)
synthesis sweep --yes              # archive without prompting
synthesis sweep --archive-only     # skip routing, send everything to archive/
```

**File categories swept:**
- **EPHEMERAL** — session names: `TONIGHT-*`, `*-COMPLETE.md`, `*-PLAN.md`, `*-STATUS.md`, `READY-TO-*`, `PRE-FLIGHT*`
- **SCRIPTS** — `.sh`/`.bash` files older than `--days`
- **ARTIFACTS** — archives (`.zip`, `.tar.gz`, `.7z`, `.rar`, etc.) regardless of age
- **COMPLETED REPORTS** — dated names (`2024-*`, `*-2025-COMPLETE`, etc.) older than `--days`

**Routing intelligence (default):** Before archiving, sweep evaluates each file against
workspace routing rules (same pipeline as `staging route`):
1. Glob pattern match on filename
2. Companion `.synthesis.md` keyword match (if `synthesis enrich` has been run)
3. Falls back to `archive/swept-{date}/` if no rule matches

Dry-run output shows two groups:
```
  ROUTABLE (destination found):
    run-overnight.sh         → knowledge-infrastructure/automation/
    2024-DISCOVERY-REPORT.md → eXOReaction/business/reports/

  ARCHIVE (no meaningful destination):
    TONIGHT-NOTES.md         → archive/swept-2026-02-20/
```

Add sweep-specific rules to your config's `routing.rules` section — the same rules
used by `staging route` are evaluated here too.

