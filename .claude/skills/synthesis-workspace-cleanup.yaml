## Related Commands

- `synthesis maintain` — housekeeping, change tracking, staging ingest/route
- `synthesis staging route` — route Downloads files using routing rules (shares rule evaluation with `sweep`)
- `synthesis enrich` — generate `.synthesis.md` companions for PDFs/images (enables content-based routing in sweep)
- `synthesis prune` — empty-directory cleanup (safe to run frequently)
