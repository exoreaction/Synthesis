instructions: |
  # Synthesis Code Knowledge Graph (CKG)

  Complete static analysis system for Java source workspaces. Five phases (CKG-1 through CKG-5),
  all complete as of v1.14.0-SNAPSHOT.

  Only applies to CODE-classified directories. Document workspaces use the knowledge graph system.

  ---

  ## Phase Overview

  | Phase | Command | What it does |
  |-------|---------|-------------|
  | CKG-1 | `extract` | Persist class-level dependency graph to SQLite; fast relate/impact |
  | CKG-2 | `describe` / `health` | Module profiles (fan-in/out/instability); 7 structural health signals |
  | CKG-3 | `gaps` | Quality gap detection (missing tests/interfaces/docs); completeness scoring |
  | CKG-4 | (default) | DAG visualization grouped by architectural layer; cycles, hotspots, violations |
  | CKG-5 | `security` | 21-signal security analysis: traditional + agentic AI surfaces |

  ---

  ## CKG-1: Extraction

  ```bash
  synthesis code-graph extract -d /src/exoreaction        # Full extraction
  synthesis code-graph extract --incremental -d /src/...  # Incremental (git-aware, changed files only)
  synthesis code-graph extract --dry-run -d /src/...      # Preview: count files, no writes
  synthesis code-graph extract --stats -d /src/...        # Show current graph statistics
  synthesis cg extract -d /src/exoreaction                # Alias: cg
  ```

  **Output (full extraction):**
  ```
  Files processed: 501
  Dependencies found: 4,026
  Cross-format links: 280
  Elapsed: 33.5s
  Graph persisted to SQLite.
  ```

  ### Repo isolation (V14, PR #233)
  Package identity is `(workspace_path, repo_name, package_name)` — NOT just `(workspace, package)`.
  - `repo_name` = first path component relative to workspace root (e.g. `Quadim-Skill-Service`)
  - Single-repo workspaces use `repo_name = ""` — unaffected
  - Multi-repo workspaces MUST re-extract after upgrading past V14
  - Without repo isolation, 52% of Quadim packages spanned multiple repos → 87% false-positive cycles

  ---

  ## CKG-2: Module Profiles + Health

  ```bash
  synthesis code-graph describe -d /src/...               # All module profiles
  synthesis code-graph describe --module "io.ex.syn.cli"  # Filter to one module
  synthesis code-graph describe --instability             # Sort by instability desc
  synthesis code-graph describe --refresh                 # Force recompute (bypass cache)
  synthesis code-graph describe --format json

  synthesis code-graph health -d /src/...                 # All health signals
  synthesis code-graph health --errors-only               # HIGH severity only
  synthesis code-graph health --format json
  ```

  **Instability metric (Robert C. Martin):** `instability = fanOut / (fanIn + fanOut)`
  - `0.0` = maximally stable — should be foundation/core (many depend on it)
  - `1.0` = maximally unstable — should be entry/CLI (no dependents)
  - Orphans (fanIn=0, fanOut=0) → 0.5 by convention

  **7 health signals:**
  | Signal | Severity | Condition |
  |--------|----------|-----------|
  | C001_CIRCULAR_DEPENDENCY | HIGH | Package A ↔ Package B mutual imports |
  | C010_HIGH_FAN_IN_NO_INTERFACE | MEDIUM | fan_in > 5 and no interface |
  | C012_GOD_PACKAGE | MEDIUM | total_files > 20 |
  | C013_UNSTABLE_CORE | HIGH | Core package (low fan-out) with instability > 0.5 |
  | C014_ORPHAN_CODE | LOW | Public class with fan_in = 0 |
  | C020_HOTSPOT | HIGH | commits_last_30_days > 10 |
  | C021_DOCUMENTATION_GAP | LOW | No README + no skill coverage |

  ---

  ## CKG-3: Quality Gaps

  ```bash
  synthesis code-graph gaps -d /src/...                   # All gaps
  synthesis code-graph gaps --severity HIGH               # Filter by severity
  synthesis code-graph gaps --type MISSING_TESTS          # Filter by type
  synthesis code-graph gaps --module "io.ex.syn.graph"    # Filter to module
  synthesis code-graph gaps --score                       # Show completeness scores (0.0-1.0)
  synthesis code-graph gaps --format json
  ```

  **5 gap types:**
  | Gap Type | Severity | Condition |
  |----------|----------|-----------|
  | MISSING_TESTS | HIGH | Module has Java files but no test counterparts |
  | MISSING_INTERFACE | MEDIUM | fan_in > 3 but no interface defined |
  | UNDOCUMENTED_HIGH_VALUE | MEDIUM | fan_in > 5 with no Javadoc |
  | MISSING_README | LOW | No README.md |
  | MISSING_PACKAGE_INFO | LOW | No package-info.java |

  **Completeness scoring:** `score = 1.0 - Σ(penalties)` (floor 0.0)
  - HIGH gap: -0.30 | MEDIUM gap: -0.15 | LOW gap: -0.05

  ---

  ## CKG-4: DAG Visualization (default command)

  ```bash
  synthesis code-graph -d /src/...                        # ASCII DAG by layer (default)
  synthesis code-graph --cycles                           # Circular dependency pairs
  synthesis code-graph --hotspots                         # Unstable high-coupling packages (instability >0.7 AND fan-in >2)
  synthesis code-graph --instability                      # All packages sorted instability desc
  synthesis code-graph --layers                           # Same as default (explicit)
  synthesis code-graph --cross-format                     # SQL/YAML → Java cross-format links
  synthesis code-graph --format mermaid                   # Mermaid graph TD (max 30 packages)
  ```

  **4-tier architectural layers:**
  | Layer | Name | Instability | Expected contents |
  |-------|------|-------------|-------------------|
  | 1 | Foundation | 0.00-0.25 | Core models, domain types, interfaces |
  | 2 | Core Services | 0.26-0.50 | Service implementations, repositories |
  | 3 | Application | 0.51-0.75 | Orchestrators, use cases |
  | 4 | Entry/CLI | 0.76-1.00 | Commands, main, MCP server |

  ---

  ## CKG-5: Security Analysis (NEW — v1.14.0)

  ```bash
  synthesis code-graph security -d /src/...               # All findings (text output)
  synthesis code-graph security --refresh                 # Re-analyze before display
  synthesis code-graph security --severity HIGH           # Filter by severity (HIGH/MEDIUM/LOW/INFO)
  synthesis code-graph security --errors-only             # HIGH only (alias for --severity HIGH)
  synthesis code-graph security --type S001_SQL_INJECTION # Filter by signal type
  synthesis code-graph security --module "io.ex.syn.cli"  # Filter by package
  synthesis code-graph security --attack-surface          # Show attack surface map (entry→sink paths)
  synthesis code-graph security --scan-secrets            # Also scan non-Java files for secrets
  synthesis code-graph security --format json             # JSON output for CI/automation
  ```

  ### 21 Security Signals

  **Traditional Security (S001-S014):**
  | Signal | Severity | Detects |
  |--------|----------|---------|
  | S001_SQL_INJECTION | HIGH | String concatenation in SQL context |
  | S002_HARDCODED_SECRET | HIGH | Passwords/keys/tokens in string literals |
  | S003_WEAK_CRYPTO | MEDIUM | MD5, SHA-1 usage |
  | S004_INSECURE_RANDOM | MEDIUM | java.util.Random in security context |
  | S005_XXE_VULNERABILITY | HIGH | XML parser without FEATURE_SECURE_PROCESSING |
  | S006_PATH_TRAVERSAL | HIGH | Unvalidated path construction from user input |
  | S007_UNSAFE_DESERIALIZATION | HIGH | ObjectInputStream without ObjectInputFilter |
  | S008_SSRF | HIGH | User-controlled HTTP requests |
  | S009_EXPOSED_INTERNAL | MEDIUM | Internal API exposed via public endpoint |
  | S010_DEPENDENCY_KNOWN_VULN | HIGH | CVE match in declared pom.xml dependencies |
  | S011_OVERLY_BROAD_CATCH | LOW | catch(Exception e) or catch(Throwable t) |
  | S012_OPEN_REDIRECT | HIGH | User-controlled redirect URL |
  | S013_TEMP_FILE_RACE | LOW | java.io.File.createTempFile without secure flag |
  | S014_LOG_INJECTION | MEDIUM | User input in log statements without sanitization |

  **Agentic AI-Specific (S015-S021):**
  | Signal | Severity | Detects |
  |--------|----------|---------|
  | S015_ATTACK_SURFACE_ENTRY | INFO | CLI command entry points (informational inventory) |
  | S016_DIRECT_PROMPT_INJECTION | HIGH | User-controlled params flowing into prompt construction |
  | S017_RAG_POISONING | HIGH | Search results piped into prompts without sanitization |
  | S018_UNCONFIRMED_AGENTIC_ACTION | HIGH | Destructive MCP tool action without dryRun check |
  | S019_UNVALIDATED_AGENTIC_PATH | HIGH | Path from agent params without startsWith containment check |
  | S020_TOOL_RESULT_INJECTION | HIGH | Tool result content passed to LLM without boundary |
  | S021_MISSING_PROMPT_BOUNDARIES | HIGH | Prompt templates lacking `<system>`/`<user>` boundary tags |

  ### Dependency CVE Catalog
  `DependencyInventoryExtractor` parses `pom.xml` and matches against embedded `known-vulnerabilities.json`:
  - Log4Shell (CVE-2021-44228): log4j-core < 2.17.1
  - Text4Shell (CVE-2022-42889): commons-text < 1.10.0
  - Jackson (CVE-2022-42003): jackson-databind < 2.13.2
  - Spring4Shell, Spring Security, etc.

  ### Attack Surface Map
  `--attack-surface` uses BFS on `code_dependencies` to trace paths from CLI entry points to sinks.
  Each edge shows `sinkType` (file-io, sql, network, ai) and `hopCount`.

  ### Known False Positive Patterns
  | Signal | Scenario | Notes |
  |--------|----------|-------|
  | S001 | Internal SQL string building | ~50% FP — fires on `"DELETE FROM " + tableName` even when tableName is a constant |
  | S002 | Regex patterns for detection | `"-----BEGIN.*PRIVATE KEY"` in security scanners triggers S002 |
  | S015 | All CLI commands | Informational only — not vulnerabilities, just entry point inventory |

  ---

  ## SQLite Schema

  ### V13 — Code Knowledge Graph
  ```sql
  code_dependencies(
    workspace_path, repo_name, source_file, source_class, source_package,
    target_file, target_class, target_package, dependency_type, is_external, last_computed,
    UNIQUE(workspace_path, repo_name, source_file, target_class, target_package)
  )
  module_profiles(
    workspace_path, repo_name, module_path, package_name, inferred_purpose,
    fan_in, fan_out, instability, total_files, confidence, last_computed,
    UNIQUE(workspace_path, repo_name, module_path)
  )
  cross_format_links(workspace_path, source_file, target_file, link_type, entity_name, last_computed)
  code_quality_gaps(
    workspace_path, repo_name, module_path, gap_type, description, severity, file_path, suggestion, last_computed
  )
  ```

  ### V14 — Repo Isolation (added `repo_name` to V13 tables)

  ### V15 — Security Analysis
  ```sql
  security_findings(
    workspace_path, signal_id, severity, cwe_id, file_path, line_number,
    class_name, package_name, description, evidence, suggestion, flow_type, last_computed,
    UNIQUE(workspace_path, signal_id, file_path, line_number)
  )
  declared_dependencies(
    workspace_path, group_id, artifact_id, version, scope, pom_file, last_computed,
    UNIQUE(workspace_path, group_id, artifact_id, pom_file)
  )
  attack_surface_edges(
    workspace_path, entry_file, entry_class, sink_file, sink_class,
    sink_type, hop_count, path, last_computed,
    UNIQUE(workspace_path, entry_file, sink_file, sink_type)
  )
  ```

  ---

  ## Automatic Maintenance (Phase 10)

  `synthesis maintain` includes Phase 10 (Code Graph) and Phase 11 (Security) automatically:
  - If graph is empty → full extraction; if populated → incremental (git-aware)
  - If no `.java` files → skips (document workspace)
  - Respects `--dry-run` and `--verbose`

  ---

  ## Multi-Codebase Scale Reference (Feb 22, 2026, post-V14 re-extraction)

  | Workspace | Repos | Files | Module Profiles | Deps | Cycles | Time |
  |-----------|------:|------:|----------------:|-----:|-------:|-----:|
  | Synthesis (self) | 1 | 501 | 31 | 4,026 | 2 | ~34s |
  | Elprint | 1 | 1,194 | 266 | 11,723 | 17 | ~120s |
  | Quadim | 38 | 2,771 | 810 | 27,908 | 82 | ~16min |
  | Cantara | 54 | 4,273 | 1,198 | 37,199 | 156 | ~7min |
  | eXOReaction | ~10 | 3,057 | 386 | 24,624 | 88 | ~205s |

  **Note:** Quadim/Cantara cycles increased post-V14 (82 from 47, 156 from 128) because cross-repo
  deps within shared namespaces are now visible — these are REAL cycles, not false positives.
  Elprint decreased (17 from 22) — 5 false positives removed.

  ---

  ## Security Findings by Workspace (Feb 22, 2026)

  | Workspace | Total | HIGH | Key findings |
  |-----------|------:|-----:|-------------|
  | Synthesis | 253 | 47 | 23 prompt injection, 12 missing boundaries, 4 RAG poisoning |
  | Elprint | 378 | 118 | 92 SQL injection (legacy), 26 hardcoded secrets |
  | Quadim | 857 | 36 | 24 XXE in Whydah auth XML parsers |
  | Cantara | 836 | 95 | **3 real CVEs** (Text4Shell + 2x Jackson), 21 XXE, 40 SQL |
  | eXOReaction | 560 | 81 | Mix (includes Synthesis agentic signals) |

  Critical CVEs in Cantara: CVE-2022-42889 (Text4Shell RCE, `reactiveservices/pom.xml`)

  ---

  ## High-Value Demo Flow

  ```bash
  # Find real CVE instantly (vs running Maven Dependency Check):
  synthesis code-graph security -d /src/cantara --type S010_DEPENDENCY_KNOWN_VULN

  # Agentic security on AI tool (Synthesis itself):
  synthesis code-graph security -d /src/exoreaction/Synthesis --severity HIGH

  # Attack surface: 1,092 paths from 89 CLI entry points:
  synthesis code-graph security -d /src/exoreaction/Synthesis --attack-surface

  # Architecture DAG in 30 seconds:
  synthesis code-graph -d /src/exoreaction/Synthesis --layers

  # Cycle detection across 38-repo monorepo:
  synthesis code-graph -d /src/quadim --cycles
  ```

