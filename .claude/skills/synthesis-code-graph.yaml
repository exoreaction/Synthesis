name: synthesis-code-graph
version: 2.0.0
description: |
  Code Knowledge Graph (CKG) — static analysis of source code workspaces.
  Persists import/extends/implements relationships to SQLite, computes module profiles
  (fan-in/out/instability), detects 7 health signals, quality gaps, renders architecture
  DAGs, and runs 21-signal security analysis including agentic AI-specific surfaces.
  Commands: synthesis code-graph extract/describe/health/gaps/security + DAG flags.

