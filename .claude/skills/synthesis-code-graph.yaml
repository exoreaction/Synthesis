  | C010_HIGH_FAN_IN_NO_INTERFACE | fan_in > 5 and no interface |
  | C012_GOD_PACKAGE | total_files > 20 |
  | C013_UNSTABLE_CORE | Core package with instability > 0.5 |
  | C014_ORPHAN_CODE | Public class with fan_in = 0 |
  | C020_HOTSPOT | commits_last_30_days > 10 |
  | C021_DOCUMENTATION_GAP | No README + no skill coverage |

  ### CKG-4 DAG Flags (implemented)
  | Flag | What it shows |
  |------|--------------|
  | (none) / `--layers` | Full ASCII DAG grouped by architectural layer |
  | `--cycles` | Circular dependency pairs (A ↔ B) |
  | `--hotspots` | Unstable high-coupling packages (instability > 0.7 AND fan-in > 2) |
  | `--instability` | All packages sorted by instability descending |
  | `--cross-format` | SQL/YAML to Java cross-format links |
  | `--format mermaid` | Mermaid graph TD output (max 30 packages) |

