instructions: |
  # Synthesis Code Graph

  Persists Java source code dependency relationships to SQLite. Makes `synthesis relate` and
  `synthesis impact` instant (SQLite lookup vs file re-reading on every invocation).

  Only applies to source code workspaces (CODE-classified directories). Document workspaces
  use the knowledge graph system instead.

  ---

  ## What It Stores

  ### code_dependencies (V13 migration)
  Class-level dependency edges extracted from Java source files:
  - `source_file`, `source_class`, `source_package`
  - `target_class`, `target_package`, `target_file` (if in-project)
  - `dependency_type`: "import", "extends", "implements", "annotation"
  - `is_external`: 0 (in-project) or 1 (stdlib/third-party)

  ### module_profiles (V13, for CKG-2)
  Package-level aggregate metrics (future: module profiles with fan-in/fan-out/instability).

  ### cross_format_links (V13)
  SQL→Java, YAML→Java, doc→code links.

  ### code_quality_gaps (V13, for CKG-3)
  Missing tests, interfaces, docs per module (future: quality gap detection).

  ---

  ## Commands

  ### synthesis code-graph extract (alias: cg)
  Build or rebuild the persistent code dependency graph:

  ```bash
  # Full extraction (all Java files)
  synthesis code-graph extract -d /src/exoreaction

  # Incremental update (changed files only, git-aware)
  synthesis code-graph extract --incremental -d /src/exoreaction
  synthesis cg extract --incremental -d /src/exoreaction

  # Preview: count Java files, show what would happen, no writes
  synthesis code-graph extract --dry-run -d /src/exoreaction

  # Show current graph statistics
  synthesis code-graph extract --stats -d /src/exoreaction
  ```

  **Output (full extraction):**
  ```
  Code Graph: Extracting dependencies...
  Files processed: 347
  Dependencies found: 1,842
  Cross-format links: 23
  Elapsed: 4.2s
  Graph persisted to SQLite.
  ```

  **Output (--stats):**
  ```
  Code Graph Status: populated
  Dependencies: 1,842
  Files with deps: 347
  Last extracted: 2026-02-22T08:05:09Z
  ```

  ### synthesis relate (now SQLite-backed)
  After running `code-graph extract`, `relate` uses the persisted graph (instant):

  ```bash
  # Fast (uses SQLite graph if populated):
  synthesis relate "RelateCommand.java" -d /src/exoreaction

  # Force re-extraction from files:
  synthesis relate "RelateCommand.java" --refresh -d /src/exoreaction

  # JSON output (new in CKG-1):
  synthesis relate "RelateCommand.java" --format json -d /src/exoreaction
  ```

  ### synthesis impact (now SQLite-backed)
  BFS traversal on SQLite `code_dependencies` when graph is populated:

  ```bash
  # Fast BFS (uses SQLite graph if populated):
  synthesis impact "SearchIndex.java" -d /src/exoreaction

  # Force re-extraction:
  synthesis impact "SearchIndex.java" --refresh -d /src/exoreaction
  ```

  ### synthesis code-graph describe (CKG-2)
  Show module profiles — fan-in, fan-out, instability, inferred purpose:

  ```bash
  # All modules sorted alphabetically:
  synthesis code-graph describe -d /src/exoreaction

  # Filter to one module:
  synthesis code-graph describe --module "io.exoreaction.synthesis.cli" -d /src/exoreaction

  # Sort by instability (most unstable first):
  synthesis code-graph describe --instability -d /src/exoreaction

  # Force recompute (bypass cache):
  synthesis code-graph describe --refresh -d /src/exoreaction

  # JSON output:
  synthesis code-graph describe --format json -d /src/exoreaction
  ```

  **Instability metric (Robert C. Martin):** `instability = fanOut / (fanIn + fanOut)`
  - `0.0` = maximally stable (many dependents, no outgoing deps) — should be foundation
  - `1.0` = maximally unstable (no dependents, many outgoing deps) — should be entry/CLI
  - Orphans (fanIn=0, fanOut=0) → 0.5 by convention

  ### synthesis code-graph health (CKG-2)
  Detect health signal violations in the code graph:

  ```bash
  # All signals (all severities):
  synthesis code-graph health -d /src/exoreaction

  # HIGH severity only:
  synthesis code-graph health --errors-only -d /src/exoreaction

  # JSON output:
  synthesis code-graph health --format json -d /src/exoreaction
  ```

  **7 health signals implemented:**
  | Signal | Severity | Condition |
  |--------|----------|-----------|
  | C001_CIRCULAR_DEPENDENCY | HIGH | Package A ↔ Package B mutual imports |
  | C010_HIGH_FAN_IN_NO_TESTS | MEDIUM | fan_in > 5 and no test files |
  | C012_GOD_PACKAGE | MEDIUM | total_files > 20 |
  | C013_UNSTABLE_CORE | HIGH | Core package (low fan-out) with instability > 0.5 |
  | C014_ORPHAN_CODE | LOW | Public class with fan_in = 0 |
  | C020_HOTSPOT | HIGH | commits_last_30_days > 10 |
  | C021_DOCUMENTATION_GAP | LOW | No README + no skill coverage |

  ### synthesis code-graph gaps (CKG-3)
  Detect quality gaps and compute completeness scores:

  ```bash
  # All gaps:
  synthesis code-graph gaps -d /src/exoreaction

  # Filter by severity:
  synthesis code-graph gaps --severity HIGH -d /src/exoreaction

  # Filter by type:
  synthesis code-graph gaps --type MISSING_TESTS -d /src/exoreaction

  # Filter to one module:
  synthesis code-graph gaps --module "io.exoreaction.synthesis.graph" -d /src/exoreaction

  # Show completeness scores per module:
  synthesis code-graph gaps --score -d /src/exoreaction

  # JSON output:
  synthesis code-graph gaps --format json -d /src/exoreaction
  ```

  **5 gap types:**
  | Gap Type | Severity | Condition |
  |----------|----------|-----------|
  | MISSING_TESTS | HIGH | Module has Java files but no test counterparts |
  | MISSING_INTERFACE | MEDIUM | fan_in > 3 but no interface defined |
  | UNDOCUMENTED_HIGH_VALUE | MEDIUM | fan_in > 5 with no Javadoc |
  | MISSING_README | LOW | Module has no README.md |
  | MISSING_PACKAGE_INFO | LOW | No package-info.java |

  **Completeness scoring:** `score = 1.0 - Σ(penalties)` (floor 0.0)
  - HIGH gap: -0.30 per gap
  - MEDIUM gap: -0.15 per gap
  - LOW gap: -0.05 per gap

  ### synthesis code-graph (no subcommand) — DAG view (CKG-4)
  Default view: full package dependency DAG grouped by architectural layer:

  ```bash
  # ASCII DAG (default, same as --layers):
  synthesis code-graph -d /src/exoreaction

  # Show circular dependency pairs:
  synthesis code-graph --cycles -d /src/exoreaction

  # Show unstable high-coupling packages (instability >0.7 AND fan-in >2):
  synthesis code-graph --hotspots -d /src/exoreaction

  # All packages sorted by instability descending:
  synthesis code-graph --instability -d /src/exoreaction

  # Layer diagram with SDP violation markers (same as default):
  synthesis code-graph --layers -d /src/exoreaction

  # SQL/YAML → Java cross-format links:
  synthesis code-graph --cross-format -d /src/exoreaction

  # Mermaid graph TD output (max 30 packages, paste into mermaid.live):
  synthesis code-graph --format mermaid -d /src/exoreaction
  ```

  **4-tier architectural layers (Martin instability metric):**
  | Layer | Name | Instability | Expected contents |
  |-------|------|-------------|-------------------|
  | 1 | Foundation | 0.00-0.25 | Core models, domain types, interfaces |
  | 2 | Core Services | 0.26-0.50 | Service implementations, repositories |
  | 3 | Application | 0.51-0.75 | Orchestrators, use cases |
  | 4 | Entry/CLI | 0.76-1.00 | Commands, main, MCP server |

  **Stable Dependencies Principle:** A package in Layer 1 (stable) importing from Layer 4 (unstable)
  is a violation — shown in both `--layers` and `--cycles` output.

  ---

  ## Automatic Maintenance (Phase 10)

  `synthesis maintain` now includes **Phase 10: Code Graph** which runs automatically:
  - If graph is empty → runs full extraction
  - If graph is populated → runs incremental update (git-aware: only changed files)
  - If workspace has no `.java` files → skips entirely (document workspace)
  - Respects `--dry-run` and `--verbose`

  ```bash
  synthesis maintain -d /src/exoreaction --verbose
  # Shows: "Phase 10/10: Code Graph - updating 3 changed files"
  ```

  ---

  ## High-Value Queries (SQLite)

  | Question | Approach |
  |----------|---------|
  | "Who calls this class?" | `synthesis relate "Foo.java"` (callers shown under "Referenced by") |
  | "What does this package depend on?" | `synthesis relate "SomeService.java" --format json` |
  | "What breaks if I change this?" | `synthesis impact "CoreClass.java"` (BFS up the graph) |
  | "What's the blast radius?" | `synthesis impact "SearchIndex.java" --depth 3` |

  ---

  ## Architecture

  ### CodeGraphExtractor
  Wraps existing extraction classes (`ViolationDetector`, `GraphBuilder`, `CrossFormatLinker`).
  - `extractAndPersist(projectRoot, conn)` — full extraction, clears old data first
  - `incrementalUpdate(projectRoot, conn, changedFiles)` — per-file update, replaces only changed
  - `findJavaFiles(root)` — walk, filter `.java` only
  - `buildClassToFileMap(files, root)` — maps class name → relative path

  ### CodeGraphRepository
  DAO for all four CKG tables. Uses `INSERT OR REPLACE` for idempotency.
  - `saveDependency(conn, dep)` / `getDependenciesFrom(conn, workspace, file)`
  - `getDependenciesTo(conn, workspace, targetClass)` — callers
  - `countDependencies(conn, workspace)` — for stats
  - `clearDependencies(conn, workspace, file)` — for incremental updates

  ### CodeGraphStats
  Result record from extraction: `filesProcessed`, `dependenciesFound`, `crossFormatLinksFound`, `elapsedMs`.

  ---

  ## SQLite Tables

  ```sql
  -- Class-level dependency edges
  code_dependencies(
    workspace_path, source_file, source_class, source_package,
    target_file, target_class, target_package, dependency_type, is_external,
    last_computed,
    UNIQUE(workspace_path, source_file, target_class, target_package)
  )

  -- Module profiles (CKG-2: fan-in/out, instability)
  module_profiles(
    workspace_path, module_path, package_name, inferred_purpose,
    fan_in, fan_out, instability, total_files, confidence, last_computed,
    UNIQUE(workspace_path, module_path)
  )

  -- Cross-format links (SQL→Java, YAML→Java, doc→code)
  cross_format_links(
    workspace_path, source_file, target_file, link_type, entity_name,
    last_computed,
    UNIQUE(workspace_path, source_file, target_file, entity_name)
  )

  -- Quality gaps (CKG-3: missing tests, interfaces, docs)
  code_quality_gaps(
    workspace_path, module_path, gap_type, description, severity, file_path,
    suggestion, last_computed,
    UNIQUE(workspace_path, module_path, gap_type, file_path)
  )
  ```

