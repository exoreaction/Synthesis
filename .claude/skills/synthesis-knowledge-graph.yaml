name: synthesis-knowledge-graph
version: 1.0.0
description: |
  Semantic knowledge graph for document workspaces. Directories get centroid (what they ARE),
  wants (what they WANT TO BECOME), health signals, and bidding-based file routing.
  Commands: synthesis describe, knowledge-graph (kg), structure, evolution, feedback, route-explain.

trigger_phrases:
  - "synthesis knowledge-graph"
  - "synthesis kg"
  - "synthesis describe"
  - "synthesis structure"
  - "synthesis evolution"
  - "synthesis feedback"
  - "synthesis route-explain"
  - "directory centroid"
  - "directory wants"
  - "directory health"
  - "knowledge graph"
  - "want satisfaction"
  - "bidding routing"
